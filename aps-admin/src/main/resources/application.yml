server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: aps-admin
  jackson:
    default-property-inclusion: non_null
  lifecycle:
    timeout-per-shutdown-phase: 30s
  # 默认 profile 不连接数据库，保证无 DB 环境也能启动；dev profile 覆盖为 Flyway 开启
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:aps}
    username: ${DB_USER:aps}
    password: ${DB_PASSWORD:}
  flyway:
    enabled: false

# MyBatis-Plus 持久层基座（M1-BD-01）：仅新增本段，不涉及数据源 / Flyway / springdoc
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
  global-config:
    banner: false
    db-config:
      # 主键由调用方或数据库默认值提供（UUID / BIGSERIAL 两种策略并存）
      id-type: input
      # 与 V1 的 deleted BOOLEAN 对齐
      logic-delete-field: deleted
      logic-delete-value: "true"
      logic-not-delete-value: "false"

# M2-SE-03 求解异步生命周期与进度推送（C20/C28）
aps:
  # C27/P0-1 认证：mode 缺省 prod（安全模式默认开启），off 只能显式配置；
  # JWT 密钥无内置默认值，未配置时启动失败（ApiSecurityConfigurationValidator）
  security:
    mode: ${APS_SECURITY_MODE:prod}
    jwt:
      secret: ${APS_SECURITY_JWT_SECRET:}
      ttl-seconds: ${APS_SECURITY_JWT_TTL_SECONDS:28800}
      required-role: ${APS_SECURITY_JWT_REQUIRED_ROLE:APS_USER}
    api-keys:
      # 仅 dev profile + dev 模式使用；留空表示禁用 API Key 入口（仅 JWT）
      write: ${APS_SECURITY_API_KEYS_WRITE:}
      read: ${APS_SECURITY_API_KEYS_READ:}
    websocket:
      # P1-4 Origin 白名单，默认仅本地前端开发端口；逗号分隔
      allowed-origins: ${APS_SECURITY_WS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  solve:
    # POST /solve-tasks 一律返回 SolveTaskDetail（C20），执行方式不影响响应结构；
    # 此处不再提供 async-enabled 部署开关。
    # stomp：STOMP 实时推送；none：只缓存快照，前端回退轮询
    progress-push: ${APS_SOLVE_PROGRESS_PUSH:stomp}
    # SE-06 引擎异常/超时/不可用降级标记开关
    fallback-enabled: ${APS_SOLVE_FALLBACK_ENABLED:true}
    # 有界队列容量；单工作线程保证每场景最多 1 个 RUNNING
    queue-capacity: ${APS_SOLVE_QUEUE_CAPACITY:32}
    # 超时看门狗宽限秒数，避免与引擎内部 spentLimit 竞争
    timeout-grace-seconds: ${APS_SOLVE_TIMEOUT_GRACE_SECONDS:5}
    # M3 C37 §25.8.1 重试：仅 ENGINE_ERROR/TIMEOUT/SOLVER_UNAVAILABLE 可重试；
    # 退避由可注入时钟控制（SolveRetryClock），测试不真实休眠
    retry:
      # C37 §25.8.1：首次 + 1 次重试 = 最多 2 次尝试；第 2 次仍失败即终态
      max-retries: ${APS_SOLVE_RETRY_MAX_RETRIES:1}
      # 固定重试间隔（秒）
      delay-seconds: ${APS_SOLVE_RETRY_DELAY_SECONDS:30}
  # 审计身份（C27）：仅 dev 模式生效，用于填充 created_by/updated_by/published_by
  audit:
    # 开发态缺省操作人 UUID（X-User-Id 未带时使用）；生产禁用，prod 走 JWT subject
    dev-user-id: ${APS_AUDIT_DEV_USER_ID:}
  # 业务时区（C32 compare 交期截止点口径）：部署机时区不可信，显式配置，默认 Asia/Shanghai
  business:
    time-zone: ${APS_BUSINESS_TIME_ZONE:Asia/Shanghai}
  # 通知 outbox 轮询驱动（C33）：默认关闭；仅 dev profile 在 application-dev.yml 打开
  notification:
    scheduler:
      enabled: false
      # 轮询固定间隔（毫秒），对应 @Scheduled fixedDelay
      interval-ms: 30000

logging:
  level:
    root: INFO
    com.hengce.aps: INFO

# OpenAPI / Swagger（P0-08）；分组定义见 OpenApiConfiguration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    try-it-out-enabled: true
  default-produces-media-type: application/json
