server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: aps-admin
  jackson:
    default-property-inclusion: non_null
  lifecycle:
    timeout-per-shutdown-phase: 30s
  # 默认 profile 不连接数据库，保证无 DB 环境也能启动；dev profile 覆盖为 Flyway 开启
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:aps}
    username: ${DB_USER:aps}
    password: ${DB_PASSWORD:}
  flyway:
    enabled: false

logging:
  level:
    root: INFO
    com.hengce.aps: INFO

# OpenAPI / Swagger（P0-08）；分组定义见 OpenApiConfiguration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    try-it-out-enabled: true
  default-produces-media-type: application/json
