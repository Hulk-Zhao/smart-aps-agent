openapi: 3.0.3
info:
  title: 衡策 APS - 甘特图与计划 API
  version: 0.1.0
  description: |
    gantt 分组静态契约（P0-08），当前全部为占位。统一约定见 ../../docs/api/conventions.md。
    M2 冻结：C21（增量重排锁定）、C22（人工调整/撤销重做）、C24（计划版本发布回滚）、C29（订单甘特读接口）。
    所有时间字段为 ISO-8601 UTC；planId 一律使用 plan_version.id（UUID），不再以 sandboxId 充当计划 id。
    甘特图接口返回非分页结构；时间字段为 ISO-8601 UTC。
servers:
  - url: /api/v1
tags:
  - name: 甘特图
  - name: 计划
paths:
  /gantt/resource:
    get:
      operationId: resourceGantt
      tags: [甘特图]
      summary: 资源甘特图
      description: |
        状态：占位。按资源泳道返回任务条。
        实现归属：求解流（S3）；契约见 docs/api/contract-freeze.md C4。
        返回与 [from, to) 有交集的任务，按 resourceCode、sequenceInResource 稳定排序。
      x-implementation-status: placeholder
      x-owner: solve-flow
      parameters:
        - $ref: '#/components/parameters/SandboxId'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - name: resourceCodes
          in: query
          description: 资源编码，逗号分隔；为空表示全部
          schema:
            type: array
            items:
              type: string
          style: form
          explode: false
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultOfResourceGantt'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '501':
          $ref: '#/components/responses/NotImplemented'
  /gantt/order:
    get:
      operationId: orderGantt
      tags: [甘特图]
      summary: 订单甘特图
      description: |
        状态：占位（契约已冻结 C29，实现归 W4）。按订单泳道返回工序链。
        late = 任务 endTime 超过订单 dueDate 当日 UTC 23:59:59；订单级 lateMinutes 为整数分钟，
        仅 late=true 时给出，late=false 时省略或 null（不得填 0 冒充）。
        任务 lockType：M2 由 task.status 推导 FROZEN|NONE，V5 生效后回读 task.lock_type（可扩展 TIME_WINDOW|RESOURCE）。
        非分页结构，排序固定为 orderNo, operationIndex，不按交期；from/to 只做窗口过滤不改排序。
      x-implementation-status: placeholder
      parameters:
        - $ref: '#/components/parameters/SandboxId'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - name: orderNos
          in: query
          description: 订单号，逗号分隔；为空表示全部
          schema:
            type: array
            items:
              type: string
          style: form
          explode: false
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultOfOrderGantt'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '501':
          $ref: '#/components/responses/NotImplemented'
  /tasks/{id}/adjust:
    post:
      operationId: adjustTask
      tags: [计划]
      summary: 人工调整任务
      description: |
        状态：占位（契约已冻结 C22，实现归 W4）。
        operation=MOVE/LOCK/FREEZE/UNFREEZE；SPLIT/MERGE 枚举已冻结但 M2 返回 50100。
        version 与 task.version 不一致返回 40901；FROZEN 任务 MOVE 返回 42201；dryRun=true 只校验不落库。
      x-implementation-status: placeholder
      parameters:
        - name: id
          in: path
          required: true
          description: 排产任务 BIGSERIAL id
          schema:
            type: integer
            format: int64
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskAdjustRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultOfTaskAdjust'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          description: 无调整权限（M2 占位放行，M3 接 RBAC）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '501':
          $ref: '#/components/responses/NotImplemented'
  /tasks/adjustments/{adjustmentId}/undo:
    post:
      operationId: undoTaskAdjustment
      tags: [计划]
      summary: 撤销任务调整
      description: 状态：占位。按任务栈撤销最近一次调整；每任务最多 50 步。
      x-implementation-status: placeholder
      parameters:
        - name: adjustmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultOfTaskAdjust'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /tasks/adjustments/{adjustmentId}/redo:
    post:
      operationId: redoTaskAdjustment
      tags: [计划]
      summary: 重做任务调整
      description: 状态：占位。重做被撤销的调整。
      x-implementation-status: placeholder
      parameters:
        - name: adjustmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultOfTaskAdjust'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /tasks/{id}/adjustments:
    get:
      operationId: listTaskAdjustments
      tags: [计划]
      summary: 任务调整历史
      description: 状态：占位。分页返回该任务的调整记录。
      x-implementation-status: placeholder
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 20
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'
        '404':
          $ref: '#/components/responses/NotFound'
  /plans/{id}/publish:
    post:
      operationId: publishPlan
      tags: [计划]
      summary: 发布计划
      description: |
        状态：已实现（C24，W5）。
        把 plan_version(id=UUID) 的任务快照固化为 PUBLISHED，并回填 task.plan_version_id；重复发布幂等返回 200。
      x-implementation-status: implemented
      parameters:
        - name: id
          in: path
          required: true
          description: 计划版本 UUID（plan_version.id）
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanPublishRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultOfPlanAction'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /plans/{id}/rollback:
    post:
      operationId: rollbackPlan
      tags: [计划]
      summary: 回滚计划
      description: |
        状态：已实现（C24，W5）。
        回滚生成新 plan_version（rollback_of=原版本），不物理回退；存在已执行任务（IN_PROGRESS/COMPLETED）时返回 40903。
      x-implementation-status: implemented
      parameters:
        - name: id
          in: path
          required: true
          description: 当前计划版本 UUID（plan_version.id）
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanRollbackRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultOfPlanAction'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
components:
  parameters:
    SandboxId:
      name: sandboxId
      in: query
      required: false
      description: 场景 UUID；为空时取默认 BASELINE 00000000-0000-0000-0000-000000000401
      schema:
        type: string
        format: uuid
        default: 00000000-0000-0000-0000-000000000401
    From:
      name: from
      in: query
      required: true
      description: ISO-8601 UTC
      schema:
        type: string
        format: date-time
    To:
      name: to
      in: query
      required: true
      description: ISO-8601 UTC
      schema:
        type: string
        format: date-time
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: 幂等键，8-128 位 [A-Za-z0-9._:-]
      schema:
        type: string
        minLength: 8
        maxLength: 128
  responses:
    BadRequest:
      description: 参数错误（code=40000）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Result'
    NotFound:
      description: 资源不存在（code=40400）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Result'
    Conflict:
      description: 状态或幂等冲突（code=40900/40901）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Result'
    Unprocessable:
      description: 业务校验失败（code=42200）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Result'
    NotImplemented:
      description: 占位端点未实现（HTTP 501，code=50100）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Result'
  schemas:
    Result:
      type: object
      required: [code, message, traceId]
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
        data:
          nullable: true
        traceId:
          type: string
    TaskStatus:
      type: string
      enum: [PLANNED, FROZEN, IN_PROGRESS, COMPLETED]
    GanttTask:
      type: object
      properties:
        id:
          type: integer
          format: int64
        orderNo:
          type: string
        operationIndex:
          type: integer
        operationName:
          type: string
          nullable: true
        resourceCode:
          type: string
          nullable: true
        secondaryResourceCodes:
          type: array
          items:
            type: string
        startTime:
          type: string
          format: date-time
          nullable: true
        endTime:
          type: string
          format: date-time
          nullable: true
        setupStartTime:
          type: string
          format: date-time
          nullable: true
        setupEndTime:
          type: string
          format: date-time
          nullable: true
        qty:
          type: number
          nullable: true
        status:
          $ref: '#/components/schemas/TaskStatus'
        sequenceInResource:
          type: integer
          nullable: true
        version:
          type: integer
        lockType:
          type: string
          enum: [NONE, TIME_WINDOW, RESOURCE, FROZEN]
          description: C21 锁定类型；缺省 NONE。M2 由 task.status 推导 FROZEN|NONE，V5 生效后回读 task.lock_type
        late:
          type: boolean
          description: C29 是否晚于订单交期
    GanttResourceRow:
      type: object
      properties:
        resourceCode:
          type: string
        resourceName:
          type: string
        resourceType:
          type: string
          description: PRIMARY/SECONDARY/HUMAN/TOOL
        calendarId:
          type: string
          format: uuid
          nullable: true
          description: |
            C4 增量：该资源生效日历的 calendar.id（优先级：资源专属 > 资源组 > 全厂默认）。
            未绑定任何日历时为 null，前端按全厂默认日历兜底，禁止逐个再查 /calendars。
        calendarBound:
          type: boolean
          description: C4 增量：是否已绑定专属/资源组日历摘要；calendarId 为 null 时固定 false
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/GanttTask'
    GanttOrderRow:
      type: object
      properties:
        orderNo:
          type: string
        materialCode:
          type: string
        dueDate:
          type: string
          format: date
        priority:
          type: string
          enum: [URGENT, HIGH, NORMAL, LOW]
        freezeStatus:
          type: string
          enum: [UNFROZEN, FROZEN, LOCKED_TIME_WINDOW, LOCKED_RESOURCE]
        late:
          type: boolean
          description: 任务 endTime 是否超过订单 dueDate 当日 UTC 23:59:59
        lateMinutes:
          type: integer
          nullable: true
          description: 仅 late=true 时给出，整数分钟；late=false 时省略或 null
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/GanttTask'
    TaskAdjustRequest:
      type: object
      required: [operation, version]
      properties:
        operation:
          type: string
          enum: [MOVE, LOCK, FREEZE, UNFREEZE, SPLIT, MERGE]
          description: SPLIT/MERGE 在 M2 返回 50100
        version:
          type: integer
          description: 乐观锁版本，过期返回 40901
        resourceCode:
          type: string
          nullable: true
        secondaryResourceCodes:
          type: array
          items:
            type: string
        startTime:
          type: string
          format: date-time
          nullable: true
        endTime:
          type: string
          format: date-time
          nullable: true
        lockFrom:
          type: string
          format: date-time
          nullable: true
          description: LOCK 时的时间窗起点
        lockTo:
          type: string
          format: date-time
          nullable: true
          description: LOCK 时的时间窗终点，必须大于 lockFrom
        lockedResourceCodes:
          type: array
          items:
            type: string
          description: LOCK 时可选的资源锁；为空表示仅锁时间
        dryRun:
          type: boolean
          default: false
        reason:
          type: string
          nullable: true
          description: FREEZE 时必填
        frozen:
          type: boolean
          default: false
          deprecated: true
          description: M1 兼容别名，等价 operation=FREEZE/UNFREEZE
    TaskAdjustResult:
      type: object
      properties:
        adjustmentId:
          type: string
          format: uuid
        applied:
          type: boolean
        dryRun:
          type: boolean
        task:
          $ref: '#/components/schemas/GanttTask'
        conflicts:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
              message:
                type: string
              relatedTaskIds:
                type: array
                items:
                  type: integer
                  format: int64
    PlanPublishRequest:
      type: object
      properties:
        reason:
          type: string
          nullable: true
        approver:
          type: string
          nullable: true
    PlanRollbackRequest:
      type: object
      required: [targetVersionNo]
      properties:
        targetVersionNo:
          type: integer
          minimum: 1
        reason:
          type: string
          nullable: true
    PlanAction:
      type: object
      properties:
        planId:
          type: string
          format: uuid
        planNo:
          type: string
          nullable: true
        version:
          type: integer
        targetVersionNo:
          type: integer
          nullable: true
        status:
          type: string
          enum: [DRAFT, REVIEW, PUBLISHED, ARCHIVED]
        publishedAt:
          type: string
          format: date-time
          nullable: true
        affectedTaskCount:
          type: integer
    ResultOfResourceGantt:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data:
              type: object
              properties:
                sandboxId:
                  type: string
                  format: uuid
                from:
                  type: string
                  format: date-time
                to:
                  type: string
                  format: date-time
                resources:
                  type: array
                  items:
                    $ref: '#/components/schemas/GanttResourceRow'
    ResultOfOrderGantt:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data:
              type: object
              properties:
                sandboxId:
                  type: string
                  format: uuid
                from:
                  type: string
                  format: date-time
                to:
                  type: string
                  format: date-time
                orders:
                  type: array
                  items:
                    $ref: '#/components/schemas/GanttOrderRow'
    ResultOfGanttTask:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/GanttTask'
    ResultOfTaskAdjust:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/TaskAdjustResult'
    ResultOfPlanAction:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/PlanAction'
