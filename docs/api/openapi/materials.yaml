    RoutingStatus:
      type: string
      enum: [DRAFT, ACTIVE, INACTIVE]
    RoutingDependType:
      type: string
      enum: [FS, SS, FF]
      description: M1 仅支持 FS/SS/FF（V1 routing_edge CHECK）；SF 需新迁移
    RoutingNode:
      type: object
      required: [seqNo]
      description: |
        节点字段对应 routing_node 真实列。资源引用统一用 UUID：
        `primaryResourceId` 持久化到 `routing_node.overrides.primaryResourceId`
        （V1 的 routing_node 没有 primary_resource_id 列）；`secondaryResourceIds`
        持久化到 `overrides.secondaryResourceIds`，未覆盖时继承 operation_template。
        `overrides.primaryResourceId` 为三态且**缺键 ≠ null**：
        缺键=未覆盖（INHERIT，回退模板）；`null`=显式主资源浮动（FLOAT，求解器可选资源）；
        UUID=固定主资源（FIXED）。请求用 `primaryResourceMode` 表达三态，
        响应同时回显 `primaryResourceMode` 与 `primaryResourceId`（契约 C15 §20.3.1）。
        `resourceCode`/`sequence` 仅为旧占位兼容字段，请求不再使用。
      properties:
        seqNo:
          type: integer
          minimum: 0
          description: 节点序号，路线内唯一；对应 routing_node.seq_no
        operationTemplateId:
          type: string
          format: uuid
          nullable: true
          description: 工序模版 UUID；对应 operation_template_id
        operationCode:
          type: string
          nullable: true
          description: 工序编码；对应 routing_node.operation_code
        operationName:
          type: string
          nullable: true
          description: 工序名称；对应 routing_node.operation_name
        standardSeconds:
          type: integer
          nullable: true
          minimum: 0
          description: 标准加工秒数；对应 routing_node.standard_seconds
        setupSeconds:
          type: integer
          nullable: true
          minimum: 0
          description: 换型秒数；对应 routing_node.setup_seconds
        primaryResourceMode:
          type: string
          enum: [INHERIT, FLOAT, FIXED]
          default: INHERIT
          description: |
            主资源三态：INHERIT=请求缺省，等价 overrides 无键（回退 operation_template）；
            FLOAT=显式浮动，写入 overrides.primaryResourceId = null（此时 primaryResourceId 必须缺省或 null）；
            FIXED=固定主资源，必须同时给 primaryResourceId（否则 42200）。
            响应由 overrides 键存在性与值回显；旧请求不带本字段时按 primaryResourceId 有无推断 FIXED/INHERIT。
        primaryResourceId:
          type: string
          format: uuid
          nullable: true
          description: |
            主资源 UUID；写入 routing_node.overrides.primaryResourceId。
            仅在 primaryResourceMode=FIXED 时作为请求值；响应中 null 需结合 primaryResourceMode 区分未覆盖与显式浮动。
        primaryResourceCode:
          type: string
          nullable: true
          readOnly: true
          description: 主资源编码，仅响应回显（由 primaryResourceId 反查）
        secondaryResourceIds:
          type: array
          description: |
            辅助资源 UUID 列表；写入 routing_node.overrides.secondaryResourceIds。
            缺键（请求 null）=继承 operation_template；`[]`=显式无辅助资源；数组=显式列表。
          items:
            type: string
            format: uuid
        optional:
          type: boolean
          default: false
          description: 是否可选工序；对应 routing_node.is_optional
        resourceCode:
          type: string
          nullable: true
          readOnly: true
          deprecated: true
          description: 旧占位字段，仅响应兼容；请求请使用 primaryResourceId
        sequence:
          type: integer
          nullable: true
          readOnly: true
          deprecated: true
          description: 旧占位字段，等价 seqNo；仅响应兼容
        industryAttrs:
          type: object
    RoutingEdge:
      type: object
      required: [fromSeqNo, toSeqNo]
      description: |
        边按 seqNo 表达，服务端映射到 routing_node.id；
        对应 routing_edge.from_node_id/to_node_id/depend_type/lag_minutes。
        `from`/`to`/`minLagMinutes` 仅为旧占位兼容字段。
      properties:
        fromSeqNo:
          type: integer
          minimum: 0
          description: 前序节点 seqNo
        toSeqNo:
          type: integer
          minimum: 0
          description: 后继节点 seqNo
        dependType:
          $ref: '#/components/schemas/RoutingDependType'
        lagMinutes:
          type: integer
          default: 0
          description: 滞后分钟；对应 routing_edge.lag_minutes
        from:
          type: string
          deprecated: true
          readOnly: true
          description: 旧占位字段（node_key），仅响应兼容
        to:
          type: string
          deprecated: true
          readOnly: true
          description: 旧占位字段（node_key），仅响应兼容
        minLagMinutes:
          type: integer
          deprecated: true
          readOnly: true
          description: 旧占位字段，等价 lagMinutes；仅响应兼容
