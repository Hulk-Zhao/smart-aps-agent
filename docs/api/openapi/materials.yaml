openapi: 3.0.3
info:
  title: 衡策 APS - 物料与主数据 API
  version: 0.1.0
  description: |
    materials 分组静态契约（P0-08）。统一返回体、分页、幂等、时间格式与错误码见
    ../../docs/api/conventions.md。标注 placeholder 的端点当前返回 501 / code=50100。
servers:
  - url: /api/v1
tags:
  - name: 物料
  - name: BOM
  - name: 资源
  - name: 日历
  - name: 工艺路线
  - name: MRP
paths:
  /materials:
    get:
      operationId: listMaterials
      tags: [物料]
      summary: 物料列表
      description: |
        状态：已实现。分页查询物料。
        筛选语义：`code` 与 `name` 为模糊匹配（contains，忽略大小写），两者之间为 **OR**；
        与 `type`、`categoryId` 等其他条件之间为 **AND**。
        即「关键字同时传 code、name」时命中任一即可，不会因两者同时传而互相排除。
      x-implementation-status: implemented
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
        - name: code
          in: query
          required: false
          description: 物料编码，模糊匹配（contains，忽略大小写）；与 name 之间为 OR
          schema:
            type: string
            maxLength: 64
        - name: name
          in: query
          required: false
          description: 物料名称，模糊匹配（contains，忽略大小写）；与 code 之间为 OR
          schema:
            type: string
            maxLength: 128
        - name: type
          in: query
          required: false
          description: 物料类型，精确匹配；与其他条件 AND
          schema:
            $ref: '#/components/schemas/MaterialType'
        - name: categoryId
          in: query
          required: false
          description: 物料分类 UUID，精确匹配；与其他条件 AND
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultOfMaterialPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
        '501':
          $ref: '#/components/responses/NotImplemented'
    post:
      operationId: createMaterial
      tags: [物料]
      summary: 创建物料
      description: 状态：已实现。业务编码 code 全局唯一。
      x-implementation-status: implemented
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaterialCreateRequest'
      responses:
        '200':
          description: 成功，data 为新建物料
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultOfMaterial'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '501':
          $ref: '#/components/responses/NotImplemented'
  /materials/{code}:
    parameters:
      - name: code
        in: path
        required: true
        description: 物料业务编码 material.code
        schema:
          type: string
          maxLength: 64
    get:
      operationId: getMaterial
      tags: [物料]
      summary: 物料详情
      description: 状态：已实现。
      x-implementation-status: implemented
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultOfMaterial'
        '404':
          $ref: '#/components/responses/NotFound'
        '501':
          $ref: '#/components/responses/NotImplemented'
    put:
      operationId: updateMaterial
      tags: [物料]
      summary: 更新物料
      description: 状态：已实现。需携带 version 做乐观锁校验。
      x-implementation-status: implemented
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaterialUpdateRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultOfMaterial'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '501':
          $ref: '#/components/responses/NotImplemented'
    delete:
      operationId: deleteMaterial
      tags: [物料]
      summary: 删除物料
      description: 状态：已实现。逻辑删除，被 BOM/订单引用时拒绝。
      x-implementation-status: implemented
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '501':
          $ref: '#/components/responses/NotImplemented'
  /materials/import:
    post:
      operationId: importMaterials
      tags: [物料]
      summary: 导入物料
      description: |
        状态：代码已落地（ImportExportController#importFile，aps-web/src/main/java/com/hengce/aps/web/controller/importexport/ImportExportController.java:108-136）；
        未做制品级 HTTP 验收，故标 partial。multipart/form-data，字段 file（Excel/CSV）。
        本路径是 /{entity}/import 的旧别名（entity=materials），由同一处理方法承接；响应为 ImportResult。
      x-implementation-status: partial
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: 成功，data 为导入统计
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /boms:
    get:
      operationId: listBoms
      tags: [BOM]
      summary: BOM 列表
      description: |
        状态：已实现。分页查询 BOM。
        筛选条件之间为 **AND**；`parentMaterialCode` 精确匹配，`status` 精确匹配。
      x-implementation-status: implemented
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
        - name: parentMaterialCode
          in: query
          required: false
          description: 父件物料编码，精确匹配 material.code
          schema:
            type: string
            maxLength: 64
        - name: status
          in: query
          required: false
          description: BOM 状态，精确匹配；与 parentMaterialCode 等条件 AND
          schema:
            $ref: '#/components/schemas/BomStatus'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultOfBomPage'
        '501':
          $ref: '#/components/responses/NotImplemented'
    post:
      operationId: createBom
      tags: [BOM]
      summary: 创建 BOM
      description: 状态：已实现。同父件同版本不可重复。
      x-implementation-status: implemented
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BomCreateRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultOfBom'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '501':
          $ref: '#/components/responses/NotImplemented'
  /boms/{bomId}:
    get:
      operationId: getBom
      tags: [BOM]
      summary: BOM 单条详情
      description: |
        状态：已实现。返回 BOM 头 + 完整 items；前端 BOM 详情不依赖列表行内 items。
        路径参数为 BOM UUID（bom.id），不是父件编码。
      x-implementation-status: implemented
      parameters:
        - name: bomId
          in: path
          required: true
          description: BOM UUID（bom.id）
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 成功，data 为 BOM 头 + items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultOfBom'
        '404':
          $ref: '#/components/responses/NotFound'
        '501':
          $ref: '#/components/responses/NotImplemented'
    delete:
      operationId: deleteBom
      tags: [BOM]
      summary: 删除 BOM（逻辑删除）
      description: |
        状态：已实现。逻辑删除 BOM 头及其自身明细（items），不物理删除。
        被 `orders.product_id` 或其他 BOM 子件行引用时返回 42200（HTTP 422）；不存在返回 40400（HTTP 404）。
      x-implementation-status: implemented
      parameters:
        - name: bomId
          in: path
          required: true
          description: BOM UUID（bom.id）
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 成功（无 data）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: BOM 被订单或其他 BOM 子件行引用（code=42200）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'
  /boms/{id}/tree:
    get:
      operationId: bomTree
      tags: [BOM]
      summary: BOM 树
      description: 状态：已实现。默认展开 5 层，超过截断。
      x-implementation-status: implemented
      parameters:
        - name: id
          in: path
          required: true
          description: BOM UUID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultOfBomTree'
        '404':
          $ref: '#/components/responses/NotFound'
        '501':
          $ref: '#/components/responses/NotImplemented'
  /boms/{id}/activate:
    post:
      operationId: activateBom
      tags: [BOM]
      summary: 激活 BOM 版本
      description: 状态：已实现。同一父件仅允许一个 ACTIVE 版本。
      x-implementation-status: implemented
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultOfBom'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '501':
          $ref: '#/components/responses/NotImplemented'
  /resources:
    get:
      operationId: listResources
      tags: [资源]
      summary: 资源列表
      description: |
        状态：已实现。分页查询资源。
        筛选语义：`code` 与 `name` 为模糊匹配（contains，忽略大小写），两者之间为 **OR**；
        与 `type`、`groupId` 之间为 **AND**。
        分页上限：`size` 默认 20、最大 200，超限按 200；需要更多资源时用 `codes` 批量（≤200 个），
        或按 page 递增取全量；甘特场景请直接用 C4 的 calendarId，不要枚举资源。
      x-implementation-status: implemented
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
        - name: codes
          in: query
          required: false
          description: |
            C27 批量取数：逗号分隔的资源 code（单次 ≤200）；存在时优先于 code/分页，
            忽略 page/size，返回命中的全部资源，total=命中数。
          schema:
            type: string
        - name: code
          in: query
          required: false
          description: 资源编码，模糊匹配（contains，忽略大小写）；与 name 之间为 OR
          schema:
            type: string
            maxLength: 64
        - name: name
          in: query
          required: false
          description: 资源名称，模糊匹配（contains，忽略大小写）；与 code 之间为 OR
          schema:
            type: string
            maxLength: 128
        - name: type
          in: query
          required: false
          description: 资源类型，精确匹配；与其他条件 AND
          schema:
            $ref: '#/components/schemas/ResourceType'
        - name: groupId
          in: query
          required: false
          description: 资源组 UUID，精确匹配；与其他条件 AND
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultOfResourcePage'
        '501':
          $ref: '#/components/responses/NotImplemented'
    post:
      operationId: createResource
      tags: [资源]
      summary: 创建资源
      description: 状态：已实现。
      x-implementation-status: implemented
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceCreateRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultOfResource'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '501':
          $ref: '#/components/responses/NotImplemented'
  /resources/{code}:
    get:
      operationId: getResource
      tags: [资源]
      summary: 资源单条详情
      description: 状态：已实现。路径参数为 resource.code（与 C6 一致）。
      x-implementation-status: implemented
      parameters:
        - name: code
          in: path
          required: true
          description: 资源编码 resource.code
          schema:
            type: string
            maxLength: 64
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultOfResource'
        '404':
          $ref: '#/components/responses/NotFound'
        '501':
          $ref: '#/components/responses/NotImplemented'
    put:
      operationId: updateResource
      tags: [资源]
      summary: 更新资源
      description: |
        状态：已实现。路径参数为 resource.code；`code` 不可修改。
        乐观锁：必须携带当前 `version`，不一致返回 40901（HTTP 409）。
      x-implementation-status: implemented
      parameters:
        - name: code
          in: path
          required: true
          description: 资源编码 resource.code
          schema:
            type: string
            maxLength: 64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceUpdateRequest'
      responses:
        '200':
          description: 成功，返回更新后的资源（version 已递增）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultOfResource'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 版本冲突（code=40901，HTTP 409）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '501':
          $ref: '#/components/responses/NotImplemented'
    delete:
      operationId: deleteResource
      tags: [资源]
      summary: 停用资源（软删除）
      description: |
        状态：已实现。将 `resource.deleted` 置为 true，不物理删除。
        被日历（calendar.resource_id）或排产任务（task.resource_id）引用时返回 42200。
        重复调用幂等，返回 200。
      x-implementation-status: implemented
      parameters:
        - name: code
          in: path
          required: true
          description: 资源编码 resource.code
          schema:
            type: string
            maxLength: 64
      responses:
        '200':
          description: 成功（无 data）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: 资源仍被日历或任务引用（code=42200）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'
        '501':
          $ref: '#/components/responses/NotImplemented'
  /resources/{code}/maintenance:
    post:
      operationId: maintainResource
      tags: [资源]
      summary: 设置资源维护计划
      description: 状态：占位。维护窗口参与排程不可用计算。路径参数为 resource.code。
      x-implementation-status: placeholder
      parameters:
        - name: code
          in: path
          required: true
          description: 资源编码 resource.code
          schema:
            type: string
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaintenanceRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultOfResource'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '501':
          $ref: '#/components/responses/NotImplemented'
  /calendars:
    get:
      operationId: listCalendars
      tags: [日历]
      summary: 日历列表
      description: |
        状态：已实现。分页查询日历。
        筛选条件之间为 **AND**：`name` 模糊匹配（contains，忽略大小写），
        `type`、`resourceId`、`resourceGroupId` 精确匹配。
      x-implementation-status: implemented
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
        - name: name
          in: query
          required: false
          description: 日历名称，模糊匹配（contains，忽略大小写）
          schema:
            type: string
            maxLength: 128
        - name: type
          in: query
          required: false
          description: 日历类型，精确匹配
          schema:
            $ref: '#/components/schemas/CalendarType'
        - name: resourceId
          in: query
          required: false
          description: 资源 UUID，精确匹配
          schema:
            type: string
            format: uuid
        - name: resourceGroupId
          in: query
          required: false
          description: 资源组 UUID，精确匹配
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultOfCalendarPage'
        '501':
          $ref: '#/components/responses/NotImplemented'
    post:
      operationId: createCalendar
      tags: [日历]
      summary: 创建日历
      description: 状态：已实现。历史日历只读，通过新版本覆盖。
      x-implementation-status: implemented
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalendarCreateRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultOfCalendar'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '501':
          $ref: '#/components/responses/NotImplemented'
  /calendars/{id}:
    get:
      operationId: getCalendar
      tags: [日历]
      summary: 日历单条详情
      description: |
        状态：已实现。路径参数为 calendar UUID（calendar.id）。
        对象结构见 C14/19.6：shifts 为工厂墙钟时间，按日历 timezone（缺省 aps.calendar.timezone，
        默认 Asia/Shanghai）解释，禁止按浏览器本地时区判定；MAKEUP 日匹配不到班次时按"调休推定"沿用全部班次并标注。
      x-implementation-status: implemented
      parameters:
        - name: id
          in: path
          required: true
          description: 日历 UUID（calendar.id）
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultOfCalendar'
        '404':
          $ref: '#/components/responses/NotFound'
        '501':
          $ref: '#/components/responses/NotImplemented'
    put:
      operationId: updateCalendar
      tags: [日历]
      summary: 更新日历
      description: |
        状态：已实现。路径参数为 calendar UUID（calendar.id）。
        历史日历（`effectiveTo < 今天`）只读，更新返回 40300（HTTP 403）；`effectiveTo` 为空表示长期有效，可更新。
        乐观锁：必须携带当前 `version`，不一致返回 40901（HTTP 409）。
        `calendarVersion` 不可通过本接口修改；新版本请走创建接口。
      x-implementation-status: implemented
      parameters:
        - name: id
          in: path
          required: true
          description: 日历 UUID（calendar.id）
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalendarUpdateRequest'
      responses:
        '200':
          description: 成功，返回更新后的日历（version 已递增）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultOfCalendar'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          description: 历史日历只读（code=40300，HTTP 403）
