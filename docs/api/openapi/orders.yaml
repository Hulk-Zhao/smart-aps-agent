      responses:
        '200':
          description: 校验/导入结果（幂等命中返回既有 strategyId 且 existing=true；dryRun=true 时不落库，strategyId 为 null）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultOfStrategyImport'
        '422':
          $ref: '#/components/responses/Unprocessable'
