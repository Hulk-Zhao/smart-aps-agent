openapi: 3.0.3
info:
  title: 衡策 APS - 订单与场景 API
  version: 0.1.0
  description: |
    orders 分组静态契约（P0-08）。GET /orders 与 GET /orders/{orderNo} 已实现，
    其余为占位；统一约定见 ../../docs/api/conventions.md。
servers:
  - url: /api/v1
tags:
  - name: 订单
  - name: 策略
  - name: 场景
paths:
  /orders:
    get:
      operationId: listOrders
      tags: [订单]
      summary: 订单列表
      description: 状态：已实现。统一分页出参。
      x-implementation-status: implemented
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultOfOrderPage'
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      operationId: createOrder
      tags: [订单]
      summary: 创建订单
      description: 状态：占位。orderNo 在租户内唯一。
      x-implementation-status: placeholder
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCreateRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultOfOrder'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '501':
          $ref: '#/components/responses/NotImplemented'
  /orders/{orderNo}:
    get:
      operationId: getOrder
      tags: [订单]
      summary: 订单详情
      description: 状态：已实现。
      x-implementation-status: implemented
      parameters:
        - name: orderNo
          in: path
          required: true
          description: 订单业务编码
          schema:
            type: string
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultOfOrder'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: updateOrder
      tags: [订单]
      summary: 更新订单
      description: |
        状态：占位。仅 `DRAFT` 可修改；非 `DRAFT` 返回 42200。
        乐观锁：请求必须携带当前 `version`，与服务端 `orders.version` 不一致返回 40901。
        `orderNo` 不可修改；允许修改 materialCode/qty/dueDate/priority/customerId/routingId/remark/extAttrs。
        路径参数为 order_no。
      x-implementation-status: placeholder
      parameters:
        - name: orderNo
          in: path
          required: true
          description: 订单业务编码 order_no
          schema:
            type: string
            maxLength: 64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderUpdateRequest'
      responses:
        '200':
          description: 成功，返回更新后的订单（version 已递增）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultOfOrder'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 版本冲突（40901）或重复/幂等冲突（40900）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '501':
          $ref: '#/components/responses/NotImplemented'
  /orders/{orderNo}/confirm:
    put:
      operationId: confirmOrder
      tags: [订单]
      summary: 确认订单
      description: |
        状态：占位。路径参数为 order_no；DRAFT → CONFIRMED。
        幂等：重复确认返回 200，不重复执行副作用；目标状态幂等，不强制 Idempotency-Key。
      x-implementation-status: placeholder
      parameters:
        - name: orderNo
          in: path
          required: true
          description: 订单业务编码 order_no
          schema:
            type: string
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultOfOrder'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '501':
          $ref: '#/components/responses/NotImplemented'
  /orders/{orderNo}/freeze:
    put:
      operationId: freezeOrder
      tags: [订单]
      summary: 冻结/解冻订单
      description: |
        状态：占位（契约已冻结 C23，实现归 W5）。路径参数为 order_no。
        同一端点承载四态冻结与解冻：body `freezeStatus=UNFROZEN` 即解冻，**不提供独立 `/unfreeze`**。
        - LOCKED_TIME_WINDOW 必填 lockFrom/lockTo，to > from；缺失返回 400/40000
        - LOCKED_RESOURCE 必填 lockedResourceCodes（trim+去重后非空），否则 42200
        - UNFROZEN/FROZEN 自动清空锁信息（幂等，不报错）
        锁信息落 orders.ext_attrs.freezeLock，不新增列；OrderView 暴露只读 freezeLock。
        version 不一致返回 40901。
      x-implementation-status: placeholder
      parameters:
        - name: orderNo
          in: path
          required: true
          description: 订单业务编码 order_no
          schema:
            type: string
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderFreezeRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultOfOrder'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '501':
          $ref: '#/components/responses/NotImplemented'
  /orders/{orderNo}/priority:
    put:
      operationId: updateOrderPriority
      tags: [订单]
      summary: 修改订单优先级
      description: |
        状态：占位（契约已冻结 C23，实现归 W5）。
        优先级只影响软约束 PRIORITY_RESPECT，不改硬约束；URGENT 不提供抢占/插队语义。
        version 不一致返回 40901。
      x-implementation-status: placeholder
      parameters:
        - name: orderNo
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderPriorityRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultOfOrder'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /orders/{orderNo}/release:
    put:
      operationId: releaseOrder
      tags: [订单]
      summary: 释放订单
      description: |
        M2 纳入（C23）。DRAFT/CONFIRMED -> RELEASED，并自动冻结该订单当前全部任务（lock_type=FROZEN）。
        body 可空：{reason?, version?}。重复释放幂等返回 200，version 不变且不重复写审计。
        非法状态流转返回 42200；version 不一致返回 40901。
      x-implementation-status: placeholder
      parameters:
        - name: orderNo
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderVersionRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultOfOrder'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /orders/{orderNo}/start:
    put:
      operationId: startOrder
      tags: [订单]
      summary: 订单开工
      description: |
        M2 纳入（C23）。RELEASED -> IN_PROGRESS，同样自动冻结该订单全部任务。
      x-implementation-status: placeholder
      parameters:
        - name: orderNo
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderVersionRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultOfOrder'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /orders/atp:
    post:
      operationId: atp
      tags: [订单]
      summary: ATP 交期预估
      description: 状态：占位。基于可用产能给出最早可承诺交期。
      x-implementation-status: placeholder
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AtpRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultOfAtp'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '501':
          $ref: '#/components/responses/NotImplemented'
  /strategies:
    get:
      operationId: listStrategies
      tags: [策略]
      summary: 策略列表
      description: 状态：占位。
      x-implementation-status: placeholder
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultOfStrategyPage'
        '501':
          $ref: '#/components/responses/NotImplemented'
    post:
      operationId: createStrategy
      tags: [策略]
      summary: 创建策略
      description: 状态：占位。name + strategyVersion 租户内唯一。
      x-implementation-status: placeholder
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StrategyCreateRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultOfStrategy'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '501':
          $ref: '#/components/responses/NotImplemented'
  /strategies/{id}/clone:
    post:
      operationId: cloneStrategy
      tags: [策略]
      summary: 克隆策略
      description: 状态：占位。生成新 strategyVersion，规则深拷贝。
      x-implementation-status: placeholder
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultOfStrategy'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '501':
          $ref: '#/components/responses/NotImplemented'
  /sandboxes:
    get:
      operationId: listSandboxes
      tags: [场景]
      summary: 场景列表
      description: 状态：占位。
      x-implementation-status: placeholder
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultOfSandboxPage'
        '501':
          $ref: '#/components/responses/NotImplemented'
    post:
      operationId: createSandbox
      tags: [场景]
      summary: 创建场景
      description: 状态：占位。WHAT_IF 从 BASELINE 复制快照；BASELINE 每租户唯一。
      x-implementation-status: placeholder
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SandboxCreateRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultOfSandbox'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '501':
          $ref: '#/components/responses/NotImplemented'
  /sandboxes/{id}/apply:
    post:
      operationId: applySandbox
      tags: [场景]
      summary: 应用场景
      description: 状态：占位。把 WHAT_IF 结果发布为主计划（BASELINE）。
      x-implementation-status: placeholder
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultOfSandbox'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '501':
          $ref: '#/components/responses/NotImplemented'
  /sandboxes/{id}/compare:
    get:
      operationId: compareSandbox
      tags: [场景]
      summary: 场景对比
      description: 状态：占位。返回交期、利用率、切换次数差异。
      x-implementation-status: placeholder
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: targetId
          in: query
          required: true
          description: 对比目标场景 UUID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultOfSandboxCompare'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '501':
          $ref: '#/components/responses/NotImplemented'
components:
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    Size:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 20
    Sort:
      name: sort
      in: query
      schema:
        type: string
        example: dueDate,asc
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: 幂等键，8-128 位 [A-Za-z0-9._:-]
      schema:
        type: string
        minLength: 8
        maxLength: 128
  responses:
    BadRequest:
      description: 参数错误（code=40000）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Result'
    NotFound:
      description: 资源不存在（code=40400）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Result'
    Conflict:
      description: 状态或幂等冲突（code=40900/40901）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Result'
    Unprocessable:
      description: 业务校验失败（code=42200）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Result'
    NotImplemented:
      description: 占位端点未实现（HTTP 501，code=50100）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Result'
  schemas:
    Result:
      type: object
      required: [code, message, traceId]
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
        data:
          nullable: true
        traceId:
          type: string
    OrderSource:
      type: string
      enum: [ERP_SYNC, MANUAL, AGENT]
    OrderPriority:
      type: string
      enum: [URGENT, HIGH, NORMAL, LOW]
    OrderStatus:
      type: string
      enum: [DRAFT, CONFIRMED, SCHEDULED, RELEASED, IN_PROGRESS, COMPLETED, CANCELLED]
    FreezeStatus:
      type: string
      enum: [UNFROZEN, FROZEN, LOCKED_TIME_WINDOW, LOCKED_RESOURCE]
    Order:
      type: object
      properties:
        orderNo:
          type: string
        materialCode:
          type: string
          description: 对应 orders.product_id → material.code
        qty:
          type: number
        status:
          $ref: '#/components/schemas/OrderStatus'
        freezeStatus:
          $ref: '#/components/schemas/FreezeStatus'
        freezeLock:
          type: object
          readOnly: true
          nullable: true
          description: C23 只读投影，来源 orders.ext_attrs.freezeLock；未冻结/无锁时为 null
          properties:
            from:
              type: string
              format: date-time
              nullable: true
            to:
              type: string
              format: date-time
              nullable: true
            resourceCodes:
              type: array
              items:
                type: string
        dueDate:
          type: string
          format: date
        priority:
          $ref: '#/components/schemas/OrderPriority'
        source:
          $ref: '#/components/schemas/OrderSource'
        customerId:
          type: string
          format: uuid
          nullable: true
        routingId:
          type: string
          format: uuid
          nullable: true
        remark:
          type: string
          nullable: true
        extAttrs:
          type: object
        version:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    OrderCreateRequest:
      type: object
      required: [orderNo, materialCode, qty, dueDate]
      properties:
        orderNo:
          type: string
          maxLength: 64
        source:
          $ref: '#/components/schemas/OrderSource'
        materialCode:
          type: string
        qty:
          type: number
          exclusiveMinimum: true
          minimum: 0
        dueDate:
          type: string
          format: date
        priority:
          $ref: '#/components/schemas/OrderPriority'
        customerId:
          type: string
          format: uuid
          nullable: true
        routingId:
          type: string
          format: uuid
          nullable: true
        remark:
          type: string
        extAttrs:
          type: object
    OrderUpdateRequest:
      type: object
      required: [version]
      description: 仅 DRAFT 可改；orderNo 不可修改；未传字段保持原值。
      properties:
        materialCode:
          type: string
          description: 对应 orders.product_id → material.code；变更时校验物料存在
        qty:
          type: number
          exclusiveMinimum: true
          minimum: 0
        dueDate:
          type: string
          format: date
        priority:
          $ref: '#/components/schemas/OrderPriority'
        customerId:
          type: string
          format: uuid
          nullable: true
        routingId:
          type: string
          format: uuid
          nullable: true
        remark:
          type: string
          nullable: true
        extAttrs:
          type: object
        version:
          type: integer
          minimum: 1
          description: 乐观锁版本；必须与当前 orders.version 一致
    OrderFreezeRequest:
      type: object
      required: [freezeStatus, version]
      properties:
        freezeStatus:
          $ref: '#/components/schemas/FreezeStatus'
        version:
          type: integer
          description: 与 orders.version 不一致返回 40901
        lockFrom:
          type: string
          format: date-time
          nullable: true
          description: freezeStatus=LOCKED_TIME_WINDOW 时必填；缺失返回 400/40000
        lockTo:
          type: string
          format: date-time
          nullable: true
          description: freezeStatus=LOCKED_TIME_WINDOW 时必填，且大于 lockFrom
        lockedResourceCodes:
          type: array
          items:
            type: string
          description: freezeStatus=LOCKED_RESOURCE 时必填且非空；服务端按 trim+去重规范化
    OrderPriorityRequest:
      type: object
      required: [priority, version]
      properties:
        priority:
          $ref: '#/components/schemas/OrderPriority'
        version:
          type: integer
    OrderVersionRequest:
      type: object
      properties:
        version:
          type: integer
        reason:
          type: string
          nullable: true
    AtpRequest:
      type: object
      required: [materialCode, qty, requestedDate]
      properties:
        materialCode:
          type: string
        qty:
          type: number
        requestedDate:
          type: string
          format: date
        customerId:
          type: string
          format: uuid
          nullable: true
    AtpResult:
      type: object
      properties:
        feasible:
          type: boolean
        earliestDate:
          type: string
          format: date
        leadTimeDays:
          type: integer
        bottleneckResourceCode:
          type: string
          nullable: true
    StrategyDirection:
      type: string
      enum: [FORWARD, BACKWARD, BOTTLENECK]
    Strategy:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        direction:
          $ref: '#/components/schemas/StrategyDirection'
        strategyVersion:
          type: integer
        effectiveFrom:
          type: string
          format: date
        effectiveTo:
          type: string
          format: date
          nullable: true
        initialRules:
          type: object
        optimizationRules:
          type: object
        applyCondition:
          type: object
        version:
          type: integer
    StrategyCreateRequest:
      type: object
      required: [name, direction, effectiveFrom]
      properties:
        name:
          type: string
        direction:
          $ref: '#/components/schemas/StrategyDirection'
        strategyVersion:
          type: integer
          default: 1
        effectiveFrom:
          type: string
          format: date
        effectiveTo:
          type: string
          format: date
          nullable: true
        initialRules:
          type: object
        optimizationRules:
          type: object
        applyCondition:
