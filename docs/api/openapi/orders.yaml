  /orders/{orderNo}/freeze:
    put:
      operationId: freezeOrder
      tags: [订单]
      summary: 冻结/解冻订单
      description: |
        状态：代码已落地（OrderController#freeze，aps-web/src/main/java/com/hengce/aps/web/controller/OrderController.java:161-165）；
        未做制品级 HTTP 验收，故标 partial。路径参数为 order_no。
        同一端点承载四态冻结与解冻：body `freezeStatus=UNFROZEN` 即解冻，**不提供独立 `/unfreeze`**。
        - LOCKED_TIME_WINDOW 必填 lockFrom/lockTo，to > from；缺失返回 400/40000
        - LOCKED_RESOURCE 必填 lockedResourceCodes（trim+去重后非空），否则 42200
        - UNFROZEN/FROZEN 自动清空锁信息（幂等，不报错）
        锁信息落 orders.ext_attrs.freezeLock，不新增列；OrderView 暴露只读 freezeLock。
        version 不一致返回 40901。
      x-implementation-status: partial
      parameters:
        - name: orderNo
          in: path
          required: true
          description: 订单业务编码 order_no
          schema:
            type: string
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderFreezeRequest'
      responses:
