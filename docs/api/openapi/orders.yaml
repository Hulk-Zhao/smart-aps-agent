  /strategies/{id}/export:
    get:
      operationId: exportStrategy
      tags: [策略]
      summary: 导出策略
      description: |
        C19 冻结形状为 `data = {strategy, rules, checksum}`，`checksum` 必出现：记录摘要（文件完整性），即 `SHA-256(canonical({strategy, rules}))`，其中 `strategy` 含 `id` 与乐观锁 `version`（hex 64 位）；同一内容从不同记录导出值不同属预期。
        实现现状（2026-11-04 核对）：当前返回扁平 StrategyExportPayload（9 字段、无 checksum），未按 wrapper 返回
        → **实现待补，M2 收口前必须补齐（W2）**，故标 partial；补齐前不得翻 implemented。
      x-implementation-status: partial
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
