      summary: 订单列表
      description: 状态：已实现。统一分页出参。
      x-implementation-status: implemented
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultOfOrderPage'
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      operationId: createOrder
      tags: [订单]
      summary: 创建订单
      description: |
        状态：代码已落地（OrderController#create，aps-web/src/main/java/com/hengce/aps/web/controller/OrderController.java:115-118）；
        未做制品级 HTTP 验收，故标 partial。默认 DRAFT/UNFROZEN；orderNo 在租户内唯一，重复返回 409/40900。
      x-implementation-status: partial
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCreateRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultOfOrder'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /orders/{orderNo}:
    get:
      operationId: getOrder
