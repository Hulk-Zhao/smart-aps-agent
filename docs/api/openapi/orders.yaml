  /strategies/import:
    post:
      operationId: importStrategy
      tags: [策略]
      summary: 导入策略
      description: |
        C19 冻结：请求 `{payload, dryRun}`，响应 `{valid, errors[], strategyId, existing}`。先按记录摘要校验文件完整性（缺失/非法/不一致 → 422/42200），再按剔除 id/version 的内容摘要比对（相同 → 200 幂等 existing=true；不同 → 409/40901，禁止自动升版本）。`dryRun=true` 共用同一套判定但不落库。
        实现现状（2026-11-04 核对）：当前只接收扁平 StrategyExportPayload、无 `dryRun` 参数，直接落库
        → **M2 必须补（W2）**，故标 partial。
      x-implementation-status: partial
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
