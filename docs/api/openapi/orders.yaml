openapi: 3.0.3
info:
  title: 衡策 APS - 订单与场景 API
  version: 0.1.0
  description: |
    orders 分组静态契约（P0-08）。GET /orders 已实现；订单写、策略、场景代码已落地但未做制品级 HTTP 验收，标 partial；
    ATP 交期预估已于 2026-11-05 完成制品级 HTTP 验收（C46），标 implemented；订单开工已于 2026-11-04 完成制品级 HTTP 验收（四条证据齐），标 implemented。
    统一约定见 ../../docs/api/conventions.md。
servers:
  - url: /api/v1
tags:
  - name: 订单
  - name: 策略
  - name: 场景
paths:
  /orders:
    get:
      operationId: listOrders
      tags: [订单]
      summary: 订单列表
      description: 状态：已实现。统一分页出参。
      x-implementation-status: implemented
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultOfOrderPage'
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      operationId: createOrder
      tags: [订单]
      summary: 创建订单
      description: |
        状态：已实现（2026-11-04 制品级 HTTP 验收：POST /orders → 200/code 0，ORD-LB-002 落库 DRAFT/UNFROZEN/version=1）。
        默认 DRAFT/UNFROZEN；orderNo 在租户内唯一，重复返回 409/40900。
      x-implementation-status: implemented
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCreateRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultOfOrder'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /orders/{orderNo}:
    get:
      operationId: getOrder
      tags: [订单]
      summary: 订单详情
      description: 状态：已实现。
      x-implementation-status: implemented
      parameters:
        - name: orderNo
          in: path
          required: true
          description: 订单业务编码
          schema:
            type: string
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultOfOrder'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: updateOrder
      tags: [订单]
      summary: 更新订单
      description: |
        状态：已实现（2026-11-04 制品级 HTTP 验收：PUT /orders/ORD-LB-002 → 200/code 0，version 1→2，qty/HIGH 落库）。
        仅 `DRAFT` 可修改；非 `DRAFT` 返回 42200。
        乐观锁：请求必须携带当前 `version`，与服务端 `orders.version` 不一致返回 40901。
        `orderNo` 不可修改；允许修改 materialCode/qty/dueDate/priority/customerId/routingId/remark/extAttrs。
        路径参数为 order_no；域内 `/{orderNo}` 已加正则排除 export/import 保留段（C38）。
      x-implementation-status: implemented
      parameters:
        - name: orderNo
          in: path
          required: true
          description: 订单业务编码 order_no
          schema:
            type: string
            maxLength: 64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderUpdateRequest'
      responses:
        '200':
          description: 成功，返回更新后的订单（version 已递增）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultOfOrder'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 版本冲突（40901）或重复/幂等冲突（40900）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /orders/{orderNo}/confirm:
    put:
      operationId: confirmOrder
      tags: [订单]
      summary: 确认订单
      description: |
        状态：已实现（2026-11-04 制品级 HTTP 验收：PUT /orders/ORD-LB-002/confirm → 200/code 0，version 2→3，status=DRAFT→CONFIRMED）。
        路径参数为 order_no；DRAFT → CONFIRMED。
        幂等：重复确认返回 200，不重复执行副作用；目标状态幂等，不强制 Idempotency-Key。
      x-implementation-status: implemented
      parameters:
        - name: orderNo
          in: path
          required: true
          description: 订单业务编码 order_no
          schema:
            type: string
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultOfOrder'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /orders/{orderNo}/freeze:
    put:
      operationId: freezeOrder
      tags: [订单]
      summary: 冻结/解冻订单
      description: |
        状态：代码已落地（OrderController#freeze，aps-web/src/main/java/com/hengce/aps/web/controller/OrderController.java:161-165）；
        未做制品级 HTTP 验收，故标 partial。路径参数为 order_no。
        同一端点承载四态冻结与解冻：body `freezeStatus=UNFROZEN` 即解冻，**不提供独立 `/unfreeze`**。
        - LOCKED_TIME_WINDOW 必填 lockFrom/lockTo，to > from；缺失返回 400/40000
        - LOCKED_RESOURCE 必填 lockedResourceCodes（trim+去重后非空），否则 42200
        - UNFROZEN/FROZEN 自动清空锁信息（幂等，不报错）
        锁信息落 orders.ext_attrs.freezeLock，不新增列；OrderView 暴露只读 freezeLock。
        version 不一致返回 40901。
        验收（2026-11-04）：LOCKED_TIME_WINDOW → 200/code 0，version 4→5；UNFROZEN → 200/code 0，version 5→6，锁信息清空。
      x-implementation-status: implemented
      parameters:
        - name: orderNo
          in: path
          required: true
          description: 订单业务编码 order_no
          schema:
            type: string
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderFreezeRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultOfOrder'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /orders/{orderNo}/priority:
    put:
      operationId: updateOrderPriority
      tags: [订单]
      summary: 修改订单优先级
      description: |
        状态：已实现（2026-11-04 制品级 HTTP 验收：PUT /orders/ORD-LB-002/priority → 200/code 0，priority=NORMAL→URGENT，version 3→4）。
        优先级只影响软约束 PRIORITY_RESPECT，不改硬约束；URGENT 不提供抢占/插队语义。
        version 不一致返回 40901。
      x-implementation-status: implemented
      parameters:
        - name: orderNo
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderPriorityRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultOfOrder'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /orders/{orderNo}/release:
    put:
      operationId: releaseOrder
      tags: [订单]
      summary: 释放订单
      description: |
        状态：已实现（2026-11-04 制品级 HTTP 验收：PUT /orders/ORD-LB-002/release → 200/code 0，status=CONFIRMED→RELEASED、freeze=FROZEN、version 6→7；
        重复释放 → 200/code 0 且 version 保持 7）。DRAFT/CONFIRMED/SCHEDULED -> RELEASED，并自动把订单下 PLANNED 任务置为 FROZEN。
        body 可空：{reason?, version?}。重复释放幂等返回 200，version 不变且不重复写审计。
        非法状态流转返回 42200；version 不一致返回 40901。
      x-implementation-status: implemented
      parameters:
        - name: orderNo
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderVersionRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultOfOrder'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /orders/{orderNo}/start:
    put:
      operationId: startOrder
      tags: [订单]
      summary: 订单开工
      description: |
        状态：已实现并完成制品级 HTTP 验收（2026-11-04，构建终验车道在新制品上实测四条证据）。
        `OrderController#start` 注册 `PUT /api/v1/orders/{orderNo}/start`（C23：RELEASED→IN_PROGRESS，自动冻结 PLANNED 任务，重复开工幂等）。
        4a 正常开工：HTTP 200、`status=IN_PROGRESS`、`version 2→3`、`traceId=a5f52cc1690a448997eda8d69f395ade`；落库 `M3-SMOKE-REL | IN_PROGRESS | UNFROZEN | version=3`，任务两行 `PLANNED→FROZEN` 且 `lock_type=FROZEN`。
        4b 重复开工幂等：HTTP 200、`status=IN_PROGRESS`、`version=3` 不再上涨、`traceId=24349fc537584ad9b520781c07449f71`。
        4c 非 RELEASED（CONFIRMED）：HTTP 422 / `code=42200`、`traceId=a3bcaf12e75548019cbebd5bd0509b9e`，message「只有 RELEASED 状态的订单可开工…」，库内 `M3-SMOKE-CONF | CONFIRMED | version=1` 未变。
        4d 乐观锁旧版本重放（库内 2 / 提交 1）：HTTP 409 / `code=40901`、`traceId=93100369032048519dd2591fbc9d8566`，message「订单已被其他请求修改，请刷新后重试」，库内 `M3-SMOKE-STALE | RELEASED | version=2` 的 version 未变更。
      x-implementation-status: implemented
      parameters:
        - name: orderNo
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderVersionRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultOfOrder'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '501':
          $ref: '#/components/responses/NotImplemented'
  /orders/atp:
    x-milestone: M3
    post:
      operationId: atp
      tags: [订单]
      summary: ATP 交期预估
      description: |
        状态：已实现（C46，制品级 HTTP 验收 2026-11-05：FAST → 200/code 0、accuracy=ESTIMATE，5 次采样 0.060–0.368s；
        ACCURATE → 200/code 0、accuracy=VERIFIED、earliestDeliveryDate=2026-11-05；ACCURATE timeoutSeconds=1 →
        200/code 0、status=TIMEOUT、accuracy=UNVERIFIED 且不返回日期）。
        只读端点：mainPlanWritten 恒为 false，不写 plan_version/task/task_adjustment/orders/solve_task；
        capacityLockSuggestion 仅为建议（advisoryOnly=true）。
      x-implementation-status: implemented
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AtpRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultOfAtp'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /orders/ctp:
    x-milestone: M3
    x-contract-id: C53
    post:
      operationId: ctpInquiry
      tags: [订单]
      summary: CTP 交期承诺询单
      description: |
        状态：**partial**——物料侧已实现，容量验证待 C2；`PROMISED` 仍不可达。
        当前实现只做物料可齐日判定；物料可齐但容量未验证时返回 `verdict=UNVERIFIED`，
        `promisedDate`/`promisedQty`/`capacityVerifiedAt`/`solver` 必须全为 null，不得对外宣称已承诺。

        同步只读询单：只有 verdict=PROMISED 才返回 promisedDate/promisedQty，且必须来自 ACCURATE 求解结果；
        禁止用 FAST 日期、规则日期或请求日期替代。超视野是业务状态 OUT_OF_HORIZON（HTTP 200），不是错误。
        并发忙返回 503/code=50300 + Retry-After；限流另用 429/42900。单次上限 15s。
        不写 plan_version/task/orders/solve_task；mainPlanWritten 恒为 false。
      x-implementation-status: partial
      x-implementation-note: 物料侧已实现且已真机验证（UNPROMISABLE / UNVERIFIED 可达）；容量验证车道进行中，PROMISED 仍不可达
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CtpRequest'
      responses:
        '200':
          description: 询单结论（可能是 UNVERIFIED / PROMISED / UNPROMISABLE / OUT_OF_HORIZON / NO_ROUTE / NO_MATERIAL / SOLVER_TIMEOUT）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultOfCtp'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '503':
          description: 并发忙（code=50300）；按 Retry-After 秒数重试
          headers:
            Retry-After:
              schema:
                type: integer
              description: 建议重试等待秒数
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'
  /strategies:
    get:
      operationId: listStrategies
      tags: [策略]
      summary: 策略列表
      description: |
        状态：已实现（2026-11-04 制品级 HTTP 验收：GET /strategies?name=LB-Strategy-B → 200/code 0，total=2）。
        每项返回 rules 与 ruleCount/weightSum；name/direction/effectiveOn 之间为 AND。
      x-implementation-status: implemented
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultOfStrategyPage'
    post:
      operationId: createStrategy
      tags: [策略]
      summary: 创建策略
      description: |
        状态：已实现（2026-11-04 制品级 HTTP 验收：POST /strategies → 200/code 0，strategy 表新增 LB-Strategy-B/version=1）。
        name + strategyVersion 租户内唯一；rules 省略时使用 8 条默认权重。
      x-implementation-status: implemented
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StrategyCreateRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultOfStrategy'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /strategies/{id}/clone:
    post:
      operationId: cloneStrategy
      tags: [策略]
      summary: 克隆策略
      description: |
        状态：已实现（2026-11-04 制品级 HTTP 验收：POST /strategies/{id}/clone → 200/code 0，新增 LB-Strategy-B-CLONE/version=1）。
        生成新 strategyVersion，规则深拷贝；id 不存在返回 40400。
      x-implementation-status: implemented
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultOfStrategy'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /strategies/{id}:
    get:
      operationId: getStrategy
      tags: [策略]
      summary: 策略详情
      description: 状态：已实现（2026-11-04 制品级 HTTP 验收：GET /strategies/{id} → 200/code 0，返回含 rules 的策略视图）。域内 `/{id}` 已加正则排除 export/import 保留段（C38）。
      x-implementation-status: implemented
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultOfStrategy'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: updateStrategy
      tags: [策略]
      summary: 更新策略（全量替换 rules）
      description: 状态：已实现（2026-11-04 制品级 HTTP 验收：PUT /strategies/{id} → 200/code 0，version 1→2，rules 全量替换）。
      x-implementation-status: implemented
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StrategyUpdateRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultOfStrategy'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
    delete:
      operationId: deleteStrategy
      tags: [策略]
      summary: 删除策略
      description: |
        状态：已实现（2026-11-04 制品级 HTTP 验收：DELETE /strategies/{id} → 200/code 0，strategy.deleted=true，data=null）。
        逻辑删除；被订单引用时返回 42200。响应 `data` 为 null。
      x-implementation-status: implemented
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 成功（data=null）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /strategies/{id}/export:
    get:
      operationId: exportStrategy
      tags: [策略]
      summary: 导出策略
      description: |
        C19 冻结形状为 `data = {strategy, rules, checksum}`，`checksum` 必出现：记录摘要（文件完整性），即 `SHA-256(canonical({strategy, rules}))`，其中 `strategy` 含 `id` 与乐观锁 `version`（hex 64 位）；同一内容从不同记录导出值不同属预期。
        验收（2026-11-04）：GET /strategies/{id}/export → 200/code 0，`data={strategy,rules,checksum}`，checksum 为 64 位 hex，
        已按 C19 wrapper 返回（早前“返回扁平载荷、无 checksum”的描述已过时）。
      x-implementation-status: implemented
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultOfStrategyExport'
        '404':
          $ref: '#/components/responses/NotFound'
  /strategies/import:
    post:
      operationId: importStrategy
      tags: [策略]
      summary: 导入策略
      description: |
        C19 冻结：请求 `{payload, dryRun}`，响应 `{valid, errors[], strategyId, existing}`。先按记录摘要校验文件完整性（缺失/非法/不一致 → 422/42200），再按剔除 id/version 的内容摘要比对（相同 → 200 幂等 existing=true；不同 → 409/40901，禁止自动升版本）。`dryRun=true` 共用同一套判定但不落库。
        验收（2026-11-04）：POST /strategies/import → 200/code 0，响应 `{valid:true,errors:[],strategyId,existing}`；
        同一内容回灌返回 `existing=true` 且不新建/不升版本（strategy 表行数不变），`dryRun=true` 不落库（早前“无 dryRun、直接落库”的描述已过时）。
      x-implementation-status: implemented
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
