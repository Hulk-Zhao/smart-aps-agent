openapi: 3.0.3
info:
  title: 衡策 APS - 订单与场景 API
  version: 0.1.0
  description: |
    orders 分组静态契约（P0-08）。GET /orders 已实现；订单写、策略、场景代码已落地但未做制品级 HTTP 验收，标 partial；
    订单开工与 ATP 仍为占位（501）。统一约定见 ../../docs/api/conventions.md。
servers:
  - url: /api/v1
tags:
  - name: 订单
  - name: 策略
  - name: 场景
paths:
