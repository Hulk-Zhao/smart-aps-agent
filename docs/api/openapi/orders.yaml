            application/json:
              schema:
                $ref: '#/components/schemas/ResultOfOrder'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 版本冲突（40901）或重复/幂等冲突（40900）
