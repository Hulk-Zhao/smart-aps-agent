components:
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    Size:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 20
    Sort:
      name: sort
      in: query
      schema:
        type: string
        example: dueDate,asc
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: 幂等键，8-128 位 [A-Za-z0-9._:-]
      schema:
        type: string
        minLength: 8
        maxLength: 128
  responses:
    BadRequest:
      description: 参数错误（code=40000）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Result'
    NotFound:
      description: 资源不存在（code=40400）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Result'
    Conflict:
      description: 状态或幂等冲突（code=40900/40901）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Result'
    Unprocessable:
      description: 业务校验失败（code=42200）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Result'
    NotImplemented:
      description: 占位端点未实现（HTTP 501，code=50100）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Result'
  schemas:
    Result:
      type: object
      required: [code, message, traceId]
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
        data:
          nullable: true
        traceId:
          type: string
    OrderSource:
      type: string
      enum: [ERP_SYNC, MANUAL, AGENT]
    OrderPriority:
      type: string
      enum: [URGENT, HIGH, NORMAL, LOW]
    OrderStatus:
      type: string
      enum: [DRAFT, CONFIRMED, SCHEDULED, RELEASED, IN_PROGRESS, COMPLETED, CANCELLED]
    FreezeStatus:
      type: string
      enum: [UNFROZEN, FROZEN, LOCKED_TIME_WINDOW, LOCKED_RESOURCE]
    Order:
      type: object
      properties:
        orderNo:
          type: string
        materialCode:
          type: string
          description: 对应 orders.product_id → material.code
        qty:
          type: number
        status:
          $ref: '#/components/schemas/OrderStatus'
        freezeStatus:
          $ref: '#/components/schemas/FreezeStatus'
        freezeLock:
          type: object
          readOnly: true
          nullable: true
          description: C23 只读投影，来源 orders.ext_attrs.freezeLock；未冻结/无锁时为 null
          properties:
            from:
              type: string
              format: date-time
              nullable: true
            to:
              type: string
              format: date-time
              nullable: true
            resourceCodes:
              type: array
              items:
                type: string
        dueDate:
          type: string
          format: date
        priority:
          $ref: '#/components/schemas/OrderPriority'
        source:
          $ref: '#/components/schemas/OrderSource'
        customerId:
          type: string
          format: uuid
          nullable: true
        customerCode:
          type: string
          maxLength: 64
          nullable: true
          readOnly: true
          x-contract-id: C50
          description: |
            C50 新增只读展示字段。来源 orders.customer_id → customer.code（同一 tenant_id、deleted=false）。
            customerId 为空、客户不存在或已软删除时为 null；禁止返回“已关联客户”等占位文案。
          example: CUS-001
        customerName:
          type: string
          maxLength: 256
          nullable: true
          readOnly: true
          x-contract-id: C50
          description: |
            C50 新增只读展示字段。来源 orders.customer_id → customer.name（同一 tenant_id、deleted=false）。
            与 customerCode 成对返回：要么同时有值，要么同时为 null。
          example: 华北储能客户 A
        routingId:
          type: string
          format: uuid
          nullable: true
        remark:
          type: string
          nullable: true
        extAttrs:
          type: object
        version:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    OrderCreateRequest:
      type: object
      required: [orderNo, materialCode, qty, dueDate]
      properties:
        orderNo:
          type: string
          maxLength: 64
        source:
          $ref: '#/components/schemas/OrderSource'
        materialCode:
          type: string
        qty:
          type: number
          exclusiveMinimum: true
          minimum: 0
        dueDate:
          type: string
          format: date
        priority:
          $ref: '#/components/schemas/OrderPriority'
        customerId:
          type: string
          format: uuid
          nullable: true
        routingId:
          type: string
          format: uuid
          nullable: true
        remark:
          type: string
        extAttrs:
          type: object
    OrderUpdateRequest:
      type: object
      required: [version]
      description: 仅 DRAFT 可改；orderNo 不可修改；未传字段保持原值。
      properties:
        materialCode:
          type: string
          description: 对应 orders.product_id → material.code；变更时校验物料存在
        qty:
          type: number
          exclusiveMinimum: true
          minimum: 0
        dueDate:
          type: string
          format: date
        priority:
          $ref: '#/components/schemas/OrderPriority'
        customerId:
          type: string
          format: uuid
          nullable: true
        routingId:
          type: string
          format: uuid
          nullable: true
        remark:
          type: string
          nullable: true
        extAttrs:
          type: object
        version:
          type: integer
          minimum: 1
          description: 乐观锁版本；必须与当前 orders.version 一致
    OrderFreezeRequest:
      type: object
      required: [freezeStatus, version]
      properties:
        freezeStatus:
          $ref: '#/components/schemas/FreezeStatus'
        version:
          type: integer
          description: 与 orders.version 不一致返回 40901
        lockFrom:
          type: string
          format: date-time
          nullable: true
          description: freezeStatus=LOCKED_TIME_WINDOW 时必填；缺失返回 400/40000
        lockTo:
          type: string
          format: date-time
          nullable: true
          description: freezeStatus=LOCKED_TIME_WINDOW 时必填，且大于 lockFrom
        lockedResourceCodes:
          type: array
          items:
            type: string
          description: freezeStatus=LOCKED_RESOURCE 时必填且非空；服务端按 trim+去重规范化
    OrderPriorityRequest:
      type: object
      required: [priority, version]
      properties:
        priority:
          $ref: '#/components/schemas/OrderPriority'
        version:
          type: integer
    OrderVersionRequest:
      type: object
      properties:
        version:
          type: integer
        reason:
          type: string
          nullable: true
    AtpRequest:
      type: object
      description: ATP 交期预估请求（C46）；全部字段可空并由服务端统一校验，非法值返回 422/42200
      required: [materialCode, qty, requestedDate]
      properties:
        materialCode:
          type: string
          maxLength: 64
          description: 必填；物料不存在返回 404/40400
        qty:
          type: number
          exclusiveMinimum: true
          minimum: 0
          maximum: 1000000000
          description: 必填，0 < qty <= 1e9
        requestedDate:
          type: string
          format: date
          description: 必填，交期偏好
        customerId:
          type: string
          format: uuid
          nullable: true
          description: 可选；格式非法由 Jackson 返回 400/40000
        orderNo:
          type: string
          maxLength: 64
          nullable: true
          description: 可选；存在时必须为 CONFIRMED/SCHEDULED/RELEASED/IN_PROGRESS 且物料一致，否则 422/42200
        mode:
          type: string
          enum: [FAST, ACCURATE]
          default: FAST
          description: FAST=构造启发式估算（ESTIMATE）；ACCURATE=Timefold 限时求解
        timeoutSeconds:
          type: integer
          minimum: 1
          maximum: 30
          nullable: true
          description: ACCURATE 可选，缺省取 aps.atp.accurate-timeout-seconds；越界 422/42200
        allowSplitBatch:
          type: boolean
          nullable: true
          default: false
          description: 可选；当前实现不拆批，仅作为建议依据
    AtpBottleneck:
      type: object
      properties:
        type:
          type: string
          enum: [RESOURCE_QUEUE, CALENDAR_GAP, OPERATION_DURATION, INFEASIBLE_HORIZON, NO_RESOURCE,
                 CRITICAL_OPERATION, DUE_DATE_MISS, SOLVE_TIMEOUT, INFEASIBLE]
        resourceCode:
          type: string
          nullable: true
        operationCode:
          type: string
          nullable: true
        operationIndex:
          type: integer
          nullable: true
        delayMinutes:
          type: integer
        detail:
          type: string
    AtpSuggestion:
      type: object
      properties:
        action:
          type: string
          enum: [SHIFT_TO_ALTERNATE_RESOURCE, ADD_OVERTIME, ADD_SHIFT, ADJUST_PROMISED_DATE, SPLIT_BATCH,
                 LOCK_CAPACITY, MAINTAIN_RESOURCE, EXTEND_TIMEOUT]
        resourceCode:
          type: string
          nullable: true
        operationCode:
          type: string
          nullable: true
        operationIndex:
          type: integer
          nullable: true
        expectedGainMinutes:
          type: integer
        detail:
          type: string
    AtpCapacityLockSuggestion:
      type: object
      description: 建议性标识，不落主计划（mainPlanWritten 恒为 false）
      properties:
        advisoryOnly:
          type: boolean
          description: 恒为 true，表示仅为建议
        required:
          type: boolean
        reason:
          type: string
        resourceCodes:
          type: array
          items:
            type: string
        from:
          type: string
          format: date-time
          nullable: true
        to:
          type: string
          format: date-time
          nullable: true
    AtpSolveInfo:
      type: object
      properties:
        engine:
          type: string
        timeoutSeconds:
          type: integer
          nullable: true
        elapsedMs:
          type: integer
        timedOut:
          type: boolean
        solverStatus:
          type: string
          nullable: true
        scoreHard:
          type: number
          nullable: true
        scoreSoft:
          type: number
          nullable: true
        assignedTaskCount:
          type: integer
        unassignedTaskCount:
          type: integer
        message:
          type: string
    AtpResult:
      type: object
      description: ATP 交期预估响应（C46）；mainPlanWritten 恒为 false，调用不产生任何主计划写入
      properties:
        materialCode:
          type: string
        qty:
          type: number
        requestedDate:
          type: string
          format: date
        orderNo:
          type: string
          nullable: true
        mode:
          type: string
          enum: [FAST, ACCURATE]
        accuracy:
          type: string
          enum: [ESTIMATE, VERIFIED, UNVERIFIED]
          description: FAST 恒为 ESTIMATE；ACCURATE 仅完整可行解为 VERIFIED
        status:
          type: string
          enum: [OK, INFEASIBLE, TIMEOUT, FAILED]
        feasible:
          type: boolean
          nullable: true
          description: 有日期时为 earliestDeliveryDate <= requestedDate；TIMEOUT 时为 null
        earliestDeliveryDate:
          type: string
          format: date
          nullable: true
          description: TIMEOUT/INFEASIBLE 时不返回，禁止伪造
        earliestDate:
          type: string
          format: date
          nullable: true
          description: C41 兼容别名，与 earliestDeliveryDate 同值
        leadTimeDays:
          type: integer
          nullable: true
        bottleneckResourceCode:
          type: string
          nullable: true
          description: C41 兼容；首要瓶颈资源编码
        bottlenecks:
          type: array
          items:
            $ref: '#/components/schemas/AtpBottleneck'
        suggestions:
          type: array
          items:
            $ref: '#/components/schemas/AtpSuggestion'
        capacityLockSuggestion:
          $ref: '#/components/schemas/AtpCapacityLockSuggestion'
        solve:
          $ref: '#/components/schemas/AtpSolveInfo'
        assumptions:
          type: array
          items:
            type: string
        mainPlanWritten:
          type: boolean
          description: 恒为 false
        message:
          type: string
    CtpRequest:
      type: object
      x-contract-id: C53
      required: [materialCode, qty, requestedDate]
      properties:
        materialCode:
          type: string
          maxLength: 64
        qty:
          type: number
          exclusiveMinimum: true
          minimum: 0
          maximum: 1000000000
        requestedDate:
          type: string
          format: date
        customerCode:
          type: string
          maxLength: 64
          nullable: true
          description: 仅用于审计/展示；客户不存在不阻断询单
        priority:
          type: string
          nullable: true
          enum: [URGENT, HIGH, NORMAL, LOW]
        allowSplitBatch:
          type: boolean
          default: false
          description: V1 不拆批；true 不改变 promisedQty
        allowSubstitute:
          type: boolean
          default: false
          description: 与 materialPolicy 合并：任一为替代即生效 SUBSTITUTE
        materialPolicy:
          type: string
          nullable: true
          default: STRICT
          enum: [STRICT, SUBSTITUTE]
        timeoutSeconds:
          type: integer
          nullable: true
          minimum: 1
          maximum: 15
          default: 15
    CtpVerdict:
      type: string
      enum: [UNVERIFIED, PROMISED, UNPROMISABLE, OUT_OF_HORIZON, NO_ROUTE, NO_MATERIAL, SOLVER_TIMEOUT, BUSY]
      description: |
        只有 PROMISED 带日期；BUSY 走 HTTP 503/50300。
        UNVERIFIED = 物料侧已判定可齐、但容量未由 ACCURATE 验证（C2 入口态）；
        此时 promisedDate/promisedQty/capacityVerifiedAt/solver 必须全为 null，不得展示为交期。
        NO_MATERIAL = 物料数据不足、无法判定（不是缺料结论），与 UNPROMISABLE（已判定缺料/不可行）互斥。
    CtpSolverSummary:
      type: object
      description: ACCURATE 验证过程摘要；solveTaskId 恒为 null（CTP 不建 solve_task）
      properties:
        engine:
          type: string
        seed:
          type: integer
          format: int64
          nullable: true
        hardScore:
          type: number
          nullable: true
        softScore:
          type: number
          nullable: true
        durationMs:
          type: integer
          format: int64
        terminationReason:
          type: string
          nullable: true
        solveTaskId:
          type: integer
          format: int64
          nullable: true
          description: 恒为 null
    CtpMaterialSummary:
      type: object
      description: C53 物料摘要开放对象；C54 不用于物料明细
      additionalProperties: true
      properties:
        bomDepth:
          type: integer
          nullable: true
        shortages:
          type: array
          nullable: true
          items:
            type: object
            additionalProperties: true
            description: 至少含 materialCode/requiredQty/availableQty/shortageQty/expectedArrival
        substitutes:
          type: array
          nullable: true
          items:
            type: object
            additionalProperties: true
            description: 至少含 materialCode/substituteCode/priority/availableQty
        assumptions:
          type: array
          nullable: true
          items:
            type: string
    CtpResult:
      type: object
      x-contract-id: C53
      description: CTP 询单响应；mainPlanWritten 恒为 false，不写任何主计划
      properties:
        inquiryId:
          type: string
          format: uuid
        verdict:
          $ref: '#/components/schemas/CtpVerdict'
        promisedDate:
          type: string
          format: date
          nullable: true
          description: 仅 PROMISED 非空；必须来自求解结果，禁止伪造
        promisedQty:
          type: number
          nullable: true
          description: 仅 PROMISED 非空；V1 等于请求 qty
        materialReadyAt:
          type: string
          format: date
          nullable: true
        capacityVerifiedAt:
          type: string
          format: date-time
          nullable: true
        horizonEnd:
          type: string
          format: date-time
          nullable: true
          description: 仅 OUT_OF_HORIZON 非空
        solver:
          allOf:
            - $ref: '#/components/schemas/CtpSolverSummary'
          nullable: true
          description: 仅发生 ACCURATE 验证时非空
        material:
          allOf:
            - $ref: '#/components/schemas/CtpMaterialSummary'
          nullable: true
        evidence:
          type: array
          items:
            type: object
            additionalProperties: true
            description: 元素 {kind, taskIds, resourceCode, start, end, detail}
        assumptions:
          type: array
          items:
            type: string
        message:
          type: string
          nullable: true
        generatedAt:
          type: string
          format: date-time
        mainPlanWritten:
          type: boolean
          description: 恒为 false
    ResultOfCtp:
      type: object
      properties:
        code:
          type: integer
        message:
          type: string
        data:
          $ref: '#/components/schemas/CtpResult'
        traceId:
          type: string
    StrategyDirection:
      type: string
      enum: [FORWARD, BACKWARD, BOTTLENECK]
    Strategy:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        direction:
          $ref: '#/components/schemas/StrategyDirection'
        strategyVersion:
          type: integer
        effectiveFrom:
          type: string
          format: date
        effectiveTo:
          type: string
          format: date
          nullable: true
        initialRules:
          type: object
        optimizationRules:
          type: object
        applyCondition:
          type: object
        version:
          type: integer
    StrategyCreateRequest:
      type: object
      required: [name, direction, effectiveFrom]
      properties:
        name:
          type: string
        direction:
          $ref: '#/components/schemas/StrategyDirection'
        strategyVersion:
          type: integer
          default: 1
        effectiveFrom:
          type: string
          format: date
        effectiveTo:
          type: string
          format: date
          nullable: true
        initialRules:
          type: object
        optimizationRules:
          type: object
        applyCondition:
          type: object
        rules:
          type: array
          items:
            $ref: '#/components/schemas/StrategyRule'
        ruleCount:
          type: integer
        weightSum:
          type: number
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    StrategyRule:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
        phase:
          type: string
          enum: [INITIAL, OPTIMIZATION]
        type:
          type: string
          enum: [HARD, SOFT]
        weight:
          type: number
        params:
          type: object
        enabled:
          type: boolean
        seqNo:
          type: integer
    StrategyUpdateRequest:
      type: object
      required: [version]
      properties:
        version:
          type: integer
          description: 乐观锁版本，必填
        name:
          type: string
          maxLength: 128
        direction:
          $ref: '#/components/schemas/StrategyDirection'
        effectiveFrom:
          type: string
          format: date
        effectiveTo:
          type: string
          format: date
          nullable: true
        initialRules:
          type: object
        applyCondition:
          type: object
        rules:
          type: array
          items:
            $ref: '#/components/schemas/StrategyRule'
    StrategyExportPayload:
      type: object
      description: 实现当前的扁平导出载荷（9 字段、无 checksum）；C19 冻结形状见 StrategyExportPackage。
      required: [formatVersion, name, direction, strategyVersion]
      properties:
        formatVersion:
          type: string
          example: '1.0'
        name:
          type: string
        direction:
          $ref: '#/components/schemas/StrategyDirection'
        strategyVersion:
          type: integer
        effectiveFrom:
          type: string
          format: date
        effectiveTo:
          type: string
          format: date
          nullable: true
        initialRules:
          type: object
        applyCondition:
          type: object
        rules:
          type: array
          items:
            $ref: '#/components/schemas/StrategyRule'
    StrategyExportPackage:
      type: object
      description: C19 冻结导出形状；checksum 必出现，是记录摘要（文件完整性）：SHA-256(canonical({strategy, rules}))，其中 strategy 含 id 与乐观锁 version。
      required: [strategy, rules, checksum]
      properties:
        strategy:
          $ref: '#/components/schemas/StrategyExportPayload'
          description: 策略头与规则集（实现当前为扁平载荷；补齐时按 C19 拆出 rules）
        rules:
          type: array
          items:
            $ref: '#/components/schemas/StrategyRule'
        checksum:
          type: string
          pattern: '^[a-f0-9]{64}$'
          description: 记录摘要（文件完整性），SHA-256(canonical({strategy, rules}))，strategy 含 id 与乐观锁 version；仅用于回灌前判断文件是否被改动，同一内容从不同记录导出值不同属预期，不得作为内容同一性判据
    ResultOfStrategyExport:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/StrategyExportPackage'
    StrategyImportRequest:
      type: object
      required: [payload]
      properties:
        payload:
          $ref: '#/components/schemas/StrategyExportPayload'
        dryRun:
          type: boolean
          default: false
          description: true 只做校验、不落库
    StrategyImportIssue:
      type: object
      properties:
        code:
          type: string
        field:
          type: string
        message:
          type: string
    StrategyImportResult:
      type: object
      required: [valid]
      properties:
        valid:
          type: boolean
        errors:
          type: array
          items:
            $ref: '#/components/schemas/StrategyImportIssue'
        strategyId:
          type: string
          format: uuid
          nullable: true
          description: dryRun=false 时给出（新建成功返回新 id，幂等命中返回既有 id）；dryRun=true 时为 null
        existing:
          type: boolean
          default: false
          description: 为 true 仅表示本次没有新建、没有升版本、没有写 rules（幂等命中既有记录）；缺省 false，不能用 strategyId 相同与否替代
    ResultOfStrategyImport:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/StrategyImportResult'
    SandboxType:
      type: string
      enum: [BASELINE, WHAT_IF, ARCHIVED]
    Sandbox:
      type: object
      description: 场景摘要（SandboxSummaryView）；不含 snapshot，字段取自 aps-service/.../service/sandbox/SandboxSummaryView.java
      properties:
