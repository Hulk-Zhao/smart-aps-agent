        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultOfSandboxCompare'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    Size:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 20
    Sort:
      name: sort
      in: query
      schema:
        type: string
        example: dueDate,asc
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: 幂等键，8-128 位 [A-Za-z0-9._:-]
      schema:
        type: string
        minLength: 8
        maxLength: 128
  responses:
    BadRequest:
      description: 参数错误（code=40000）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Result'
    NotFound:
      description: 资源不存在（code=40400）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Result'
    Conflict:
      description: 状态或幂等冲突（code=40900/40901）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Result'
    Unprocessable:
      description: 业务校验失败（code=42200）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Result'
    NotImplemented:
      description: 占位端点未实现（HTTP 501，code=50100）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Result'
  schemas:
    Result:
      type: object
      required: [code, message, traceId]
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
        data:
          nullable: true
        traceId:
          type: string
    OrderSource:
      type: string
      enum: [ERP_SYNC, MANUAL, AGENT]
    OrderPriority:
      type: string
      enum: [URGENT, HIGH, NORMAL, LOW]
    OrderStatus:
      type: string
      enum: [DRAFT, CONFIRMED, SCHEDULED, RELEASED, IN_PROGRESS, COMPLETED, CANCELLED]
    FreezeStatus:
      type: string
      enum: [UNFROZEN, FROZEN, LOCKED_TIME_WINDOW, LOCKED_RESOURCE]
    Order:
      type: object
      properties:
        orderNo:
          type: string
        materialCode:
          type: string
          description: 对应 orders.product_id → material.code
        qty:
          type: number
        status:
          $ref: '#/components/schemas/OrderStatus'
        freezeStatus:
          $ref: '#/components/schemas/FreezeStatus'
        freezeLock:
          type: object
          readOnly: true
          nullable: true
          description: C23 只读投影，来源 orders.ext_attrs.freezeLock；未冻结/无锁时为 null
          properties:
            from:
              type: string
              format: date-time
              nullable: true
            to:
              type: string
              format: date-time
              nullable: true
            resourceCodes:
              type: array
              items:
                type: string
        dueDate:
          type: string
          format: date
        priority:
          $ref: '#/components/schemas/OrderPriority'
        source:
          $ref: '#/components/schemas/OrderSource'
        customerId:
          type: string
          format: uuid
          nullable: true
        routingId:
          type: string
          format: uuid
          nullable: true
        remark:
          type: string
          nullable: true
        extAttrs:
          type: object
        version:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    OrderCreateRequest:
      type: object
      required: [orderNo, materialCode, qty, dueDate]
      properties:
        orderNo:
          type: string
          maxLength: 64
        source:
          $ref: '#/components/schemas/OrderSource'
        materialCode:
          type: string
        qty:
          type: number
          exclusiveMinimum: true
          minimum: 0
        dueDate:
          type: string
          format: date
        priority:
          $ref: '#/components/schemas/OrderPriority'
        customerId:
          type: string
          format: uuid
          nullable: true
        routingId:
          type: string
          format: uuid
          nullable: true
        remark:
          type: string
        extAttrs:
          type: object
    OrderUpdateRequest:
      type: object
      required: [version]
      description: 仅 DRAFT 可改；orderNo 不可修改；未传字段保持原值。
      properties:
        materialCode:
          type: string
          description: 对应 orders.product_id → material.code；变更时校验物料存在
        qty:
          type: number
          exclusiveMinimum: true
          minimum: 0
        dueDate:
          type: string
          format: date
        priority:
          $ref: '#/components/schemas/OrderPriority'
        customerId:
          type: string
          format: uuid
          nullable: true
        routingId:
          type: string
          format: uuid
          nullable: true
        remark:
          type: string
          nullable: true
        extAttrs:
          type: object
        version:
          type: integer
          minimum: 1
          description: 乐观锁版本；必须与当前 orders.version 一致
    OrderFreezeRequest:
      type: object
      required: [freezeStatus, version]
      properties:
        freezeStatus:
          $ref: '#/components/schemas/FreezeStatus'
        version:
          type: integer
          description: 与 orders.version 不一致返回 40901
        lockFrom:
          type: string
          format: date-time
          nullable: true
          description: freezeStatus=LOCKED_TIME_WINDOW 时必填；缺失返回 400/40000
        lockTo:
          type: string
          format: date-time
          nullable: true
          description: freezeStatus=LOCKED_TIME_WINDOW 时必填，且大于 lockFrom
        lockedResourceCodes:
          type: array
          items:
            type: string
          description: freezeStatus=LOCKED_RESOURCE 时必填且非空；服务端按 trim+去重规范化
    OrderPriorityRequest:
      type: object
      required: [priority, version]
      properties:
        priority:
          $ref: '#/components/schemas/OrderPriority'
        version:
          type: integer
    OrderVersionRequest:
      type: object
      properties:
        version:
          type: integer
        reason:
          type: string
          nullable: true
    AtpRequest:
      type: object
      required: [materialCode, qty, requestedDate]
      properties:
        materialCode:
          type: string
        qty:
          type: number
        requestedDate:
          type: string
          format: date
        customerId:
          type: string
          format: uuid
          nullable: true
    AtpResult:
      type: object
      properties:
        feasible:
          type: boolean
        earliestDate:
          type: string
          format: date
        leadTimeDays:
          type: integer
        bottleneckResourceCode:
          type: string
          nullable: true
    StrategyDirection:
      type: string
      enum: [FORWARD, BACKWARD, BOTTLENECK]
    Strategy:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        direction:
          $ref: '#/components/schemas/StrategyDirection'
        strategyVersion:
          type: integer
        effectiveFrom:
          type: string
          format: date
        effectiveTo:
          type: string
          format: date
          nullable: true
        initialRules:
          type: object
        optimizationRules:
          type: object
        applyCondition:
          type: object
        version:
          type: integer
    StrategyCreateRequest:
      type: object
      required: [name, direction, effectiveFrom]
      properties:
        name:
          type: string
        direction:
          $ref: '#/components/schemas/StrategyDirection'
        strategyVersion:
          type: integer
          default: 1
        effectiveFrom:
          type: string
          format: date
        effectiveTo:
          type: string
          format: date
          nullable: true
        initialRules:
          type: object
        optimizationRules:
          type: object
        applyCondition:
          type: object
        rules:
          type: array
          items:
            $ref: '#/components/schemas/StrategyRule'
        ruleCount:
          type: integer
        weightSum:
          type: number
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    StrategyRule:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
        phase:
          type: string
          enum: [INITIAL, OPTIMIZATION]
        type:
          type: string
          enum: [HARD, SOFT]
        weight:
          type: number
        params:
          type: object
        enabled:
          type: boolean
        seqNo:
          type: integer
    StrategyUpdateRequest:
      type: object
      required: [version]
      properties:
        version:
          type: integer
          description: 乐观锁版本，必填
        name:
          type: string
          maxLength: 128
        direction:
          $ref: '#/components/schemas/StrategyDirection'
        effectiveFrom:
          type: string
          format: date
        effectiveTo:
          type: string
          format: date
          nullable: true
        initialRules:
          type: object
        applyCondition:
          type: object
        rules:
          type: array
          items:
            $ref: '#/components/schemas/StrategyRule'
    StrategyExportPayload:
      type: object
      description: 实现当前的扁平导出载荷（9 字段、无 checksum）；C19 冻结形状见 StrategyExportPackage。
      required: [formatVersion, name, direction, strategyVersion]
      properties:
        formatVersion:
          type: string
          example: '1.0'
        name:
          type: string
        direction:
          $ref: '#/components/schemas/StrategyDirection'
        strategyVersion:
          type: integer
        effectiveFrom:
          type: string
          format: date
        effectiveTo:
          type: string
          format: date
          nullable: true
        initialRules:
          type: object
        applyCondition:
          type: object
        rules:
          type: array
          items:
            $ref: '#/components/schemas/StrategyRule'
    StrategyExportPackage:
      type: object
      description: C19 冻结导出形状；checksum 必出现，是记录摘要（文件完整性）：SHA-256(canonical({strategy, rules}))，其中 strategy 含 id 与乐观锁 version。
      required: [strategy, rules, checksum]
      properties:
        strategy:
          $ref: '#/components/schemas/StrategyExportPayload'
          description: 策略头与规则集（实现当前为扁平载荷；补齐时按 C19 拆出 rules）
        rules:
          type: array
          items:
            $ref: '#/components/schemas/StrategyRule'
        checksum:
          type: string
          pattern: '^[a-f0-9]{64}$'
          description: 记录摘要（文件完整性），SHA-256(canonical({strategy, rules}))，strategy 含 id 与乐观锁 version；仅用于回灌前判断文件是否被改动，同一内容从不同记录导出值不同属预期，不得作为内容同一性判据
    ResultOfStrategyExport:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/StrategyExportPackage'
    StrategyImportRequest:
      type: object
      required: [payload]
      properties:
        payload:
          $ref: '#/components/schemas/StrategyExportPayload'
        dryRun:
          type: boolean
          default: false
          description: true 只做校验、不落库
    StrategyImportIssue:
      type: object
      properties:
        code:
          type: string
        field:
          type: string
        message:
          type: string
    StrategyImportResult:
      type: object
      required: [valid]
      properties:
        valid:
          type: boolean
        errors:
          type: array
          items:
            $ref: '#/components/schemas/StrategyImportIssue'
        strategyId:
          type: string
          format: uuid
          nullable: true
          description: dryRun=false 时给出（新建成功返回新 id，幂等命中返回既有 id）；dryRun=true 时为 null
        existing:
          type: boolean
          default: false
          description: 为 true 仅表示本次没有新建、没有升版本、没有写 rules（幂等命中既有记录）；缺省 false，不能用 strategyId 相同与否替代
    ResultOfStrategyImport:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/StrategyImportResult'
    SandboxType:
      type: string
      enum: [BASELINE, WHAT_IF, ARCHIVED]
    Sandbox:
      type: object
      description: 场景摘要（SandboxSummaryView）；不含 snapshot，字段取自 aps-service/.../service/sandbox/SandboxSummaryView.java
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        type:
          $ref: '#/components/schemas/SandboxType'
        parentSandboxId:
          type: string
          format: uuid
          nullable: true
        expiresAt:
          type: string
          format: date-time
          nullable: true
        version:
          type: integer
        createdAt:
          type: string
          format: date-time
    SandboxApplyResult:
      type: object
      description: 场景应用结果（SandboxApplyResultView）；plan 为 C24 PlanActionView，形状定义在 gantt.yaml
      properties:
        sandbox:
          $ref: '#/components/schemas/Sandbox'
        plan:
          type: object
          description: PlanActionView（本文件不展开字段）
    SandboxCreateRequest:
      type: object
      required: [name, type]
      properties:
        name:
          type: string
        type:
          $ref: '#/components/schemas/SandboxType'
        parentSandboxId:
          type: string
          format: uuid
          nullable: true
        expiresAt:
          type: string
          format: date-time
          nullable: true
        snapshot:
          type: object
    SandboxCompare:
      type: object
      properties:
        sandboxId:
          type: string
          format: uuid
        targetId:
          type: string
          format: uuid
        dueDateDeltaMinutes:
          type: integer
        utilizationDelta:
          type: number
        setupCountDelta:
          type: integer
        addedTaskCount:
          type: integer
        removedTaskCount:
          type: integer
        movedTaskCount:
          type: integer
        truncated:
          type: boolean
          description: 明细是否被截断；计数字段始终为全量
        changedTasks:
          type: array
          description: 变更明细，最多 200 条
          items:
            type: object
            properties:
              taskId:
                type: integer
                format: int64
              orderNo:
                type: string
              resourceCode:
                type: string
              changeType:
                type: string
                enum: [ADDED, REMOVED, MOVED]
    ResultOfOrder:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/Order'
    ResultOfOrderPage:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data:
              type: object
              properties:
                items:
                  type: array
                  items:
                    $ref: '#/components/schemas/Order'
                page:
                  type: integer
                size:
                  type: integer
                total:
                  type: integer
                  format: int64
                totalPages:
                  type: integer
    ResultOfAtp:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/AtpResult'
    ResultOfStrategy:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/Strategy'
    ResultOfStrategyPage:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data:
              type: object
              properties:
                items:
                  type: array
                  items:
                    $ref: '#/components/schemas/Strategy'
                page:
                  type: integer
                size:
                  type: integer
                total:
                  type: integer
                  format: int64
                totalPages:
                  type: integer
    ResultOfSandbox:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/Sandbox'
    ResultOfSandboxApply:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/SandboxApplyResult'
    ResultOfSandboxPage:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data:
              type: object
              properties:
                items:
                  type: array
                  items:
                    $ref: '#/components/schemas/Sandbox'
                page:
                  type: integer
                size:
                  type: integer
                total:
                  type: integer
                  format: int64
                totalPages:
                  type: integer
    ResultOfSandboxCompare:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/SandboxCompare'
