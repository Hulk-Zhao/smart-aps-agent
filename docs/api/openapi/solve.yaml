openapi: 3.0.3
info:
  title: 衡策 APS - 求解与 Agent API
  version: 0.1.0
  description: |
    solve 分组静态契约（P0-08）。已实现：POST /solve-tasks、GET /solve-tasks/{id}、取消、增量重排、justifications、C19 受控 DSL；其余为占位。
    M2 冻结：C19（策略规则与受控 DSL）、C20（异步生命周期/取消/STOMP 进度）、C21（增量重排）、C28（引擎降级）。
    统一约定见 ../../docs/api/conventions.md。
    WebSocket 进度推送：/ws/solve-tasks/{id}，STOMP 订阅 /topic/solve-tasks/{id}，消息 SolveProgress，不纳入 OpenAPI paths。
    GET /solve-tasks/{id} 是唯一事实源；STOMP 只推送（快照为 best-effort，可能丢失），断线后前端回退 2 秒轮询，重连先 GET 对账。
servers:
  - url: /api/v1
tags:
  - name: 求解
  - name: Agent
x-websocket-endpoints:
  /ws/solve-tasks/{id}:
    description: |
      求解进度推送（STOMP over WebSocket）；{id} 为 solve_task BIGSERIAL id。
      订阅目的地：/topic/solve-tasks/{id}；连接后服务端尝试立即推送当前快照，但**是 best-effort、可能丢失**
      （SUBSCRIBE 异步注册与推送给出的时序竞态，C20 §24.2）。
      客户端连接后必须无条件补一次 GET /solve-tasks/{id} 并与推送帧合并；终态任务首帧一丢即永久空白，兜底不得删。
      推送节流：状态变化立即推送，progress/bestScore 最多 1 次/秒；终态必推一次并含 resultTaskId。
      不重放历史消息；事实源为 GET /solve-tasks/{id}。回滚开关 aps.solve.progress-push=poll。
    messageSchema:
      $ref: '#/components/schemas/SolveProgress'
paths:
  /solve-tasks:
    post:
      operationId: submitSolveTask
      tags: [求解]
      summary: 提交求解任务
      description: |
        状态：已实现。请求 engine 为空时使用 timefold。
        一律返回 SolveTaskDetail（C20）：状态使用六值枚举
        PENDING/RUNNING/SOLVED/FAILED/CANCELLED/TIMEOUT，SUCCESS 已废弃；
        SOLVED 时 tasks[] 返回场景任务快照。调用方按 GET /solve-tasks/{id} 轮询终态。
        订单范围（C5 §7 / C20 §24.2）：orders 无 sandbox_id，订单只按 tenant 过滤，sandboxId 只决定任务写入场景。
        未传 orderNos 时只取 status=CONFIRMED；显式 orderNos 覆盖 onlyConfirmed（DRAFT/SCHEDULED/RELEASED/IN_PROGRESS/COMPLETED 照排），
        但 CANCELLED 必须拒绝 400/40000 并逐字点名。该拒绝行为当前未实现，属 M2 必须补（W4），不随本端点计为已实现。
      x-implementation-status: implemented
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolveSubmitRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultOfSolveTaskDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /solve-tasks/{id}:
    get:
      operationId: getSolveTask
      tags: [求解]
      summary: 求解任务详情
      description: |
        状态：已实现（C20 事实源）。返回 SolveTaskDetail；终态 SOLVED 时含 tasks[] 场景任务快照。
      x-implementation-status: implemented
      parameters:
        - name: id
          in: path
          required: true
          description: 求解任务 BIGSERIAL id
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultOfSolveTaskDetail'
        '404':
          $ref: '#/components/responses/NotFound'
  /solve-tasks/{id}/cancel:
    post:
      operationId: cancelSolveTask
      tags: [求解]
      summary: 取消求解任务
      description: |
        状态：代码已落地（C20，W3）；未做制品级 HTTP 验收，故标 partial。仅 PENDING/RUNNING 可取消；其他状态返回 40901。
        取消后任务进入 CANCELLED，并终止正在运行的 Solver。
      x-implementation-status: partial
      parameters:
        - name: id
          in: path
          required: true
          description: 求解任务 BIGSERIAL id
          schema:
            type: integer
            format: int64
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultOfSolveTaskDetail'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '501':
          $ref: '#/components/responses/NotImplemented'
  /solve-tasks/{id}/justifications:
    get:
      operationId: listSolveTaskJustifications
      tags: [求解]
      summary: 求解任务约束归因
      description: |
        状态：已实现（M2-SE-05）。不分页（规模上限 8 行/次）；固定排序 deduction DESC, constraintCode ASC。
        空结果返回 200 + data: []（不是 404）；任务不存在返回 404/40400。
        deduction 是规则聚合后的扣分（weight × 违反量），不是逐条事实明细。
      x-implementation-status: implemented
      parameters:
        - name: id
          in: path
          required: true
          description: 求解任务 BIGSERIAL id
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultOfConstraintJustificationList'
        '404':
          $ref: '#/components/responses/NotFound'
  /solve-tasks/incremental:
    post:
      operationId: submitIncrementalSolveTask
      tags: [求解]
      summary: 提交增量重排任务
      description: |
        M2 冻结 C21。以 baseSolveTaskId 为 startingSolution，仅重排 affectedTaskIds 中的非冻结任务。
        写入新 solve_task 行，并在计划域生成新的 plan_version(DRAFT)；不得覆盖已 PUBLISHED 的任务。
        FROZEN 优先级高于 lockType(FROZEN/TIME_WINDOW/RESOURCE) 高于 M1 的 frozen 布尔别名。
        场景内存在 IN_PROGRESS/COMPLETED → 409/40903（场景级；与 C22/C24 同一语义，不得拆码）。
        状态：代码已落地（C21）；未做制品级 HTTP 验收，故标 partial。
      x-implementation-status: partial
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IncrementalSolveRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultOfSolveTaskDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /constraint-dsls/validate:
    post:
      operationId: validateConstraintDsl
      tags: [求解]
      summary: 校验 DSL（不落库）
      description: |
        C19 冻结。非法 DSL 仍返回 200，由报告内 valid=false 表达；问题码为 422xx。
        x-implementation-status=partial：代码已落地（W2），尚未做制品级 HTTP 验收。
      x-implementation-status: partial
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConstraintDslValidateRequest'
      responses:
        '200':
          description: 校验报告
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultOfDslValidationReport'
  /constraint-dsls:
    post:
      operationId: createConstraintDsl
      tags: [求解]
      summary: 创建 DSL 草稿版本
      description: |
        C19 冻结。校验通过后写入 DRAFT 版本，versionNo 自增；失败 42200。
        x-implementation-status=partial：代码已落地（W2），尚未做制品级 HTTP 验收。
      x-implementation-status: partial
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConstraintDslCreateRequest'
      responses:
        '200':
          description: 新版本
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultOfConstraintDsl'
        '422':
          $ref: '#/components/responses/Unprocessable'
    get:
      operationId: listConstraintDslVersions
      tags: [求解]
      summary: 某 code 的全部版本
      description: 状态：代码已落地（C19，W2）；未做制品级 HTTP 验收，故标 partial。versionNo 倒序，不分页。
      x-implementation-status: partial
      parameters:
        - name: code
          in: query
          required: true
          description: DSL 标识
          schema:
            type: string
      responses:
        '200':
          description: 版本列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultOfConstraintDslList'
  /constraint-dsls/{id}:
    get:
      operationId: getConstraintDsl
      tags: [求解]
      summary: DSL 版本详情
      description: 状态：代码已落地（C19，W2）；未做制品级 HTTP 验收，故标 partial。
      x-implementation-status: partial
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultOfConstraintDsl'
        '404':
          $ref: '#/components/responses/NotFound'
  /constraint-dsls/{id}/activate:
    post:
      operationId: activateConstraintDsl
      tags: [求解]
      summary: 激活 DSL 版本
      description: 状态：代码已落地（C19，W2）；未做制品级 HTTP 验收，故标 partial。同 code 仅一条 ACTIVE；失败自动恢复上一 ACTIVE 并 40901。
      x-implementation-status: partial
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultOfConstraintDsl'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /constraint-dsls/{id}/rollback:
    post:
      operationId: rollbackConstraintDsl
      tags: [求解]
      summary: 回滚 DSL 版本
      description: 状态：代码已落地（C19，W2）；未做制品级 HTTP 验收，故标 partial。当前 ACTIVE 置 ROLLBACK，目标版本置 ACTIVE 并记 rollbackOf。
      x-implementation-status: partial
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultOfConstraintDsl'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /agent/events:
    x-milestone: M3
    post:
      operationId: reportAgentEvent
      tags: [Agent]
      summary: 上报异常事件
      description: 状态：占位。
      x-implementation-status: placeholder
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentEventRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'
        '400':
          $ref: '#/components/responses/BadRequest'
        '501':
          $ref: '#/components/responses/NotImplemented'
  /agent/nl-to-dsl:
    x-milestone: M3
    post:
      operationId: nlToDsl
      tags: [Agent]
      summary: 自然语言转 DSL
      description: 状态：占位。输出仅生成候选 DSL，需人工确认后应用。
      x-implementation-status: placeholder
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NlToDslRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultOfNlToDsl'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '501':
          $ref: '#/components/responses/NotImplemented'
  /agent/explain/{taskId}:
    x-milestone: M3
    get:
      operationId: explainTask
      tags: [Agent]
      summary: 归因解释
      description: 状态：占位。例如加急未满足、资源瓶颈。
      x-implementation-status: placeholder
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultOfExplain'
        '404':
          $ref: '#/components/responses/NotFound'
        '501':
          $ref: '#/components/responses/NotImplemented'
  /agent/whatif:
    x-milestone: M3
    post:
      operationId: whatIf
      tags: [Agent]
      summary: 对话式 what-if
      description: 状态：占位。基于 WHAT_IF 场景试算，不直接修改主计划。
      x-implementation-status: placeholder
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WhatIfRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultOfWhatIf'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '501':
          $ref: '#/components/responses/NotImplemented'
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: 幂等键，8-128 位 [A-Za-z0-9._:-]
      schema:
        type: string
        minLength: 8
        maxLength: 128
  responses:
    BadRequest:
      description: 参数错误（code=40000）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Result'
    NotFound:
      description: 资源不存在（code=40400）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Result'
    Conflict:
      description: 状态或幂等冲突（code=40900/40901）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Result'
    Unprocessable:
      description: 业务校验失败（code=42200）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Result'
    NotImplemented:
      description: 占位端点未实现（HTTP 501，code=50100）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Result'
  schemas:
    Result:
      type: object
      required: [code, message, traceId]
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
        data:
          nullable: true
        traceId:
          type: string
    SolverEngine:
      type: string
      enum: [timefold, ortools]
      default: timefold
    SolveSubmitRequest:
      type: object
      properties:
        taskNo:
          type: string
          description: |
            客户端关联号（非主键），响应原样回显；为空时由服务端生成展示用编号。
            M1 的求解任务主键统一为 solve_task 的 BIGSERIAL id。
        sandboxId:
          type: string
          format: uuid
          description: 场景 UUID；为空时取默认 BASELINE 00000000-0000-0000-0000-000000000401
        strategyId:
          type: string
          format: uuid
          nullable: true
          description: 排产策略 UUID；为空表示使用默认策略
        engine:
          $ref: '#/components/schemas/SolverEngine'
        orderNos:
          type: array
          description: |
            显式订单号；为空时只排 status=CONFIRMED 的订单。
            显式点名覆盖该状态过滤（DRAFT/SCHEDULED/RELEASED/IN_PROGRESS/COMPLETED 照排），
            但 CANCELLED 必须拒绝 400/40000 并逐字点名（C20 §24.2；当前未实现，M2 必须补，责任人 W4）。
            订单按租户读取，无沙箱归属校验。
          items:
            type: string
        parameters:
          type: object
          additionalProperties: true
    ScheduledTask:
      type: object
      required: [orderNo, resourceCode, startTime, endTime]
      properties:
        orderNo:
          type: string
        resourceCode:
          type: string
        startTime:
          type: string
          format: date-time
          description: ISO-8601 UTC（C7）
        endTime:
          type: string
          format: date-time
    ConstraintJustification:
      type: object
      description: |
        约束归因；软约束按 constraintCode 聚合为一行（最多 8 行/次）。
        weight/deduction 为 V7 增补字段；硬约束 weight=null、deduction=0。
      required: [constraintCode, type, taskIds, description, deduction]
      properties:
        constraintCode:
          type: string
          description: |
            规则键：软约束取自 RuleCode（8 条），硬约束取自 ConstraintCodes 的 8 条硬约束编码；
            禁止用中文标题当键，中文只允许出现在 description。
        type:
          type: string
          enum: [HARD, SOFT]
        taskIds:
          type: array
          description: 聚合后的受影响任务主键（求解期新解由结果写回阶段回填）
          items:
            type: integer
            format: int64
        description:
          type: string
          description: 面向人的中文说明
        weight:
          type: integer
          nullable: true
          description: 该规则求解时生效权重；硬约束为 null
        deduction:
          type: number
          description: |
            该规则聚合后的软分扣分，正数表示被扣掉的分（weight × 违反量）；
            不是逐条违反事实的明细；硬约束为 0。始终输出。
    ResultOfConstraintJustificationList:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/ConstraintJustification'
    ConstraintDslView:
      type: object
      description: C19 受控 DSL 版本视图
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        versionNo:
          type: integer
        status:
          type: string
          enum: [DRAFT, ACTIVE, ROLLBACK]
        checksum:
          type: string
          description: 规范化 YAML 的 SHA-256
        rollbackOf:
          type: string
          format: uuid
          nullable: true
        effectiveFrom:
          type: string
          format: date-time
          nullable: true
        yamlText:
          type: string
        compiledSpec:
          type: array
          items:
            type: object
            additionalProperties: true
        createdAt:
          type: string
          format: date-time
    ConstraintDslValidateRequest:
      type: object
      required: [yamlText]
      properties:
        yamlText:
          type: string
          description: YAML 文本，≤256KB
    ConstraintDslCreateRequest:
      type: object
      required: [code, yamlText]
      properties:
        code:
          type: string
        yamlText:
          type: string
    DslValidationIssue:
      type: object
      properties:
        code:
          type: integer
        field:
          type: string
        message:
          type: string
    DslValidationReport:
      type: object
      required: [valid, issues]
      properties:
        valid:
          type: boolean
        issues:
          type: array
          items:
            $ref: '#/components/schemas/DslValidationIssue'
    ResultOfConstraintDsl:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/ConstraintDslView'
    ResultOfConstraintDslList:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/ConstraintDslView'
    ResultOfDslValidationReport:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/DslValidationReport'
    SolveTaskStatus:
      type: string
      enum: [PENDING, RUNNING, SOLVED, FAILED, CANCELLED, TIMEOUT]
    SolveTaskDetail:
      type: object
      description: C20 唯一求解响应体；DB 与 API 使用同一六值状态枚举（SUCCESS 已废弃）
      required: [taskId, status]
      properties:
        taskId:
          type: integer
          format: int64
          description: solve_task BIGSERIAL 主键（数字 id）
        sandboxId:
          type: string
          format: uuid
        strategyId:
          type: string
          format: uuid
          nullable: true
        engine:
          type: string
          description: 引擎编码，大写落库值 TIMEFOLD/ORTOOLS/RULE_BASED
        status:
          $ref: '#/components/schemas/SolveTaskStatus'
        progress:
          type: number
          minimum: 0
          maximum: 1
        phase:
          type: string
          enum: [QUEUED, ASSEMBLING, SOLVING, PERSISTING, DONE, FAILED, CANCELLED, TIMEOUT]
          description: |
            当前阶段，始终输出。PENDING=QUEUED；RUNNING 期间为 ASSEMBLING/SOLVING/PERSISTING；
            SOLVED 对应 DONE；其余终态对应同名值（FAILED/CANCELLED/TIMEOUT）。
            不得混用 C19 策略规则 phase（INITIAL/OPTIMIZATION/FINALIZING）或 status 值。
        bestScore:
          type: string
          nullable: true
        scoreHard:
          type: integer
          format: int64
          nullable: true
        scoreSoft:
          type: integer
          format: int64
          nullable: true
        elapsedMs:
          type: integer
          format: int64
        resultTaskId:
          type: integer
          format: int64
          nullable: true
        errorCode:
          type: string
          nullable: true
        errorMessage:
          type: string
          nullable: true
        degraded:
          type: boolean
          description: C28 是否发生引擎异常/超时降级
        metrics:
          type: object
          description: C28 降级标记键 engineFallback/engineFallbackReason/fallbackMode/fallbackAt/terminationReason
        startedAt:
          type: string
          format: date-time
          nullable: true
        finishedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        tasks:
          type: array
          description: status=SOLVED 时返回 sandbox 场景任务快照；其余状态为空数组
          items:
            $ref: '#/components/schemas/ScheduledTask'
    SolveProgress:
      type: object
      description: |
        C20 STOMP 进度消息；progress 0-1，终态=1。
        声明的字段一律输出（null 表示该阶段无此值），键存在性不承载业务含义。
      properties:
        taskId:
          type: integer
          format: int64
        status:
          $ref: '#/components/schemas/SolveTaskStatus'
        progress:
          type: number
          minimum: 0
          maximum: 1
        phase:
          type: string
          enum: [QUEUED, ASSEMBLING, SOLVING, PERSISTING, DONE, FAILED, CANCELLED, TIMEOUT]
          description: 与 SolveTaskDetail.phase 同一枚举；始终输出
        bestScore:
          type: string
          nullable: true
          description: Timefold 分数文本；未知时为 null，键仍存在
        elapsedMs:
          type: integer
          format: int64
        resultTaskId:
          type: integer
          format: int64
          nullable: true
          description: 仅 SOLVED 有值，其余为 null
        errorCode:
          type: string
          nullable: true
          description: 失败/超时原因码（ENGINE_ERROR/TIMEOUT/FAILED/CANCELLED）；成功为 null
        message:
          type: string
          nullable: true
    IncrementalSolveRequest:
      type: object
      required: [baseSolveTaskId]
      properties:
        baseSolveTaskId:
          type: integer
          format: int64
        affectedTaskIds:
          type: array
          items:
            type: integer
            format: int64
        sandboxId:
          type: string
          format: uuid
          nullable: true
        reason:
          type: string
          nullable: true
    AgentEventRequest:
      type: object
      required: [eventType, occurredAt]
      properties:
        eventType:
          type: string
          enum: [EQUIPMENT_DOWN, MATERIAL_SHORTAGE, ORDER_RUSH, CAPACITY_ABNORMAL]
        orderNo:
          type: string
          nullable: true
        resourceCode:
          type: string
          nullable: true
        occurredAt:
          type: string
          format: date-time
        payload:
          type: object
    NlToDslRequest:
      type: object
      required: [text]
      properties:
        text:
          type: string
        sandboxId:
          type: string
          format: uuid
          nullable: true
        context:
          type: object
    NlToDslResult:
      type: object
      properties:
        dsl:
          type: object
        confidence:
          type: number
          minimum: 0
          maximum: 1
        warnings:
          type: array
          items:
            type: string
    ExplainResult:
      type: object
      properties:
        taskId:
          type: integer
          format: int64
        summary:
          type: string
        causes:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
              description:
                type: string
              evidence:
                type: object
        suggestions:
          type: array
          items:
            type: string
    WhatIfRequest:
      type: object
      required: [sandboxId, question]
      properties:
        sandboxId:
          type: string
          format: uuid
        question:
          type: string
        parameters:
          type: object
    WhatIfResult:
      type: object
      properties:
        answer:
          type: string
        appliedChanges:
          type: array
          items:
            type: object
        impact:
          type: object
    ResultOfSolveTaskDetail:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/SolveTaskDetail'
    ResultOfNlToDsl:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/NlToDslResult'
    ResultOfExplain:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/ExplainResult'
    ResultOfWhatIf:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/WhatIfResult'
