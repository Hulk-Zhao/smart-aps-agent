      type: string
      x-contract-id: C28
      enum: [TIMEOUT, ENGINE_ERROR, SOLVER_UNAVAILABLE, SOLVER_BUSY]
      description: |
        C28 降级原因闭集。TIMEOUT/ENGINE_ERROR/SOLVER_UNAVAILABLE 属环境/引擎侧失败，可重试；
