      enum: [ORTOOLS_NOT_ENABLED, LOCK_CONTENTION, SOLVER_NOT_ASSEMBLED, SOLVER_TIMEOUT, ENGINE_EXCEPTION]
      description: |
        C28 降级成因闭集（给运维）；仅降级时出现。LOCK_CONTENTION 对应容量争用，
        与 engineFallbackReason=SOLVER_BUSY 配对，不得与 ENGINE_EXCEPTION 混用。
