openapi: 3.0.3
info:
  title: 衡策 APS - 系统管理 API
  version: 0.1.0
  description: |
    system 分组静态契约（P0-08）。GET /health 已实现；认证/RBAC 尚未启用，其余为占位。
    统一约定见 ../../docs/api/conventions.md；密码、令牌禁止写入日志。
servers:
  - url: /api/v1
tags:
  - name: 健康检查
  - name: 认证
  - name: 用户
  - name: 审计
  - name: 配置
paths:
  /health:
    get:
      operationId: health
      tags: [健康检查]
      summary: 健康检查
      description: 状态：已实现。用于存活探针，不访问数据库。
      x-implementation-status: implemented
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultOfHealth'
  /auth/login:
    post:
      operationId: login
      tags: [认证]
      summary: 登录
      description: 状态：占位。成功返回 JWT；连续失败按策略锁定账号。
      x-implementation-status: placeholder
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultOfLogin'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '501':
          $ref: '#/components/responses/NotImplemented'
  /users:
    get:
      operationId: listUsers
      tags: [用户]
      summary: 用户列表
      description: 状态：占位。
      x-implementation-status: placeholder
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
        - name: status
          in: query
          schema:
            type: string
            enum: [ACTIVE, DISABLED, LOCKED]
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultOfUserPage'
        '403':
          $ref: '#/components/responses/Forbidden'
        '501':
          $ref: '#/components/responses/NotImplemented'
    post:
      operationId: createUser
      tags: [用户]
      summary: 创建用户
      description: 状态：占位。用户名租户内唯一；密码仅以 bcrypt 落库。
      x-implementation-status: placeholder
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultOfUser'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '501':
          $ref: '#/components/responses/NotImplemented'
  /audit-logs:
    get:
      operationId: listAuditLogs
      tags: [审计]
      summary: 审计日志查询
      description: 状态：占位。敏感字段按 observability.md 脱敏后存储。
      x-implementation-status: placeholder
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
        - name: action
          in: query
          schema:
            type: string
        - name: resourceType
          in: query
          schema:
            type: string
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultOfAuditLogPage'
        '403':
          $ref: '#/components/responses/Forbidden'
        '501':
          $ref: '#/components/responses/NotImplemented'
  /configs:
    get:
      operationId: getConfigs
      tags: [配置]
      summary: 读取系统配置
      description: 状态：占位。
      x-implementation-status: placeholder
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultOfConfigs'
        '403':
          $ref: '#/components/responses/Forbidden'
        '501':
          $ref: '#/components/responses/NotImplemented'
    put:
      operationId: updateConfigs
      tags: [配置]
      summary: 更新系统配置
      description: 状态：占位。写入审计日志。
      x-implementation-status: placeholder
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigUpdateRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultOfConfigs'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '501':
          $ref: '#/components/responses/NotImplemented'
components:
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    Size:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 20
    Sort:
      name: sort
      in: query
      schema:
        type: string
        example: createdAt,desc
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: 幂等键，8-128 位 [A-Za-z0-9._:-]
      schema:
        type: string
        minLength: 8
        maxLength: 128
  responses:
    BadRequest:
      description: 参数错误（code=40000）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Result'
    Unauthorized:
      description: 未认证（code=40100）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Result'
    Forbidden:
      description: 无权限（code=40300）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Result'
    Conflict:
      description: 状态或幂等冲突（code=40900/40901）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Result'
    Unprocessable:
      description: 业务校验失败（code=42200）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Result'
    TooManyRequests:
      description: 限流（code=42900）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Result'
    NotImplemented:
      description: 占位端点未实现（HTTP 501，code=50100）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Result'
  schemas:
    Result:
      type: object
      required: [code, message, traceId]
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
        data:
          nullable: true
        traceId:
          type: string
    Health:
      type: object
      properties:
        status:
          type: string
          example: UP
        service:
          type: string
          example: aps-admin
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
    LoginResult:
      type: object
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          enum: [Bearer]
        expiresIn:
          type: integer
          description: 秒
        userId:
          type: string
          format: uuid
    UserStatus:
      type: string
      enum: [ACTIVE, DISABLED, LOCKED]
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        displayName:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/UserStatus'
        lastLoginAt:
          type: string
          format: date-time
          nullable: true
        version:
          type: integer
    UserCreateRequest:
      type: object
      required: [username]
      properties:
        username:
          type: string
          maxLength: 64
        displayName:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        password:
          type: string
          format: password
        roleCodes:
          type: array
          items:
            type: string
    AuditLog:
      type: object
      properties:
        id:
          type: string
          format: uuid
        traceId:
          type: string
        userId:
          type: string
          format: uuid
          nullable: true
        action:
          type: string
        resourceType:
          type: string
        resourceId:
          type: string
        beforeValue:
          type: object
          nullable: true
        afterValue:
          type: object
          nullable: true
        clientIp:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
    SystemConfig:
      type: object
      properties:
        key:
          type: string
        value:
          type: string
        description:
          type: string
          nullable: true
        updatedAt:
          type: string
          format: date-time
    ConfigUpdateRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [key, value]
            properties:
              key:
                type: string
              value:
                type: string
    ResultOfHealth:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/Health'
    ResultOfLogin:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/LoginResult'
    ResultOfUser:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/User'
    ResultOfUserPage:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data:
              type: object
              properties:
                items:
                  type: array
                  items:
                    $ref: '#/components/schemas/User'
                page:
                  type: integer
                size:
                  type: integer
                total:
                  type: integer
                  format: int64
                totalPages:
                  type: integer
    ResultOfAuditLogPage:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data:
              type: object
              properties:
                items:
                  type: array
                  items:
                    $ref: '#/components/schemas/AuditLog'
                page:
                  type: integer
                size:
                  type: integer
                total:
                  type: integer
                  format: int64
                totalPages:
                  type: integer
    ResultOfConfigs:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/SystemConfig'
